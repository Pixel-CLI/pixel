# Link with the `rust-lld` that ships in the toolchain (stable since 1.90)
# instead of the system linker: a full link of the CLI is 4 s against 56 s
# with Apple's ld64 on an M-series laptop, which is most of what a release
# rebuild costs. The crate is one binary with deep LTO, so the link is the
# whole tail of every release build.
#
# Only the host targets are set. The musl targets already default to
# `rust-lld`, and under `cross` a `-fuse-ld=lld` would point at a binary the
# container may not have.
[target.aarch64-apple-darwin]
rustflags = ["-C", "link-arg=-fuse-ld=lld"]

[target.x86_64-apple-darwin]
rustflags = ["-C", "link-arg=-fuse-ld=lld"]

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-fuse-ld=lld"]

[target.aarch64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-fuse-ld=lld"]
