# cargo-mutants configuration (https://mutants.rs/). How and when to run it
# is documented in CONTRIBUTING.md, "Mutation testing".

# Benches are not shipped and carry no tests: every mutant there would be a
# false "missed".
# Build scripts run at compile time; a mutated one changes what the build
# reports, not what a test asserts. The glob is anchored at a crate root on
# purpose: `**/build.rs` reads as "cargo build scripts" but matches any
# source file of that name, and this workspace has one --
# crates/pixel-graph/src/build.rs, the module behind build_graph, tree_delta
# and the freshness signature, which sat outside the gate for as long as the
# glob did. An exclusion here must never be able to swallow a module;
# scripts/test-mutants-config.py holds that line.
exclude_globs = ["crates/pixel-bench/**", "**/benches/**", "crates/*/build.rs"]

# Debug output is diagnostic, never part of the wire contract. Display is
# deliberately kept: tokens, error codes and op names reach JSON and the
# journal through it.
exclude_re = ["impl Debug"]

# Only the mutated crate's own tests run for each mutant (the default). The
# CLI contract tests in crates/pixel exercise the built binary, so a mutant
# in a library crate is judged by that crate's unit and `tests/all` suite.
test_workspace = false

# The cargo arguments every lane shares: CI's shards, scripts/mutants-preflight.sh
# --run, scripts/gates.sh --mutants and a hand-typed `cargo mutants -F ...`
# all read this file, so none of them may pass these on its command line.
# A lane that adds one alone runs a different program: --all-targets decides
# which targets are built (a mutant that breaks only an example or a bench
# is unviable with it and invisible without it) and drops the doctests from
# every mutant's run; --locked refuses a Cargo.lock another resolution would
# rewrite. scripts/test-mutants-config.py holds both halves of that line.
additional_cargo_args = ["--locked"]
# After --all-targets the bare `--` hands the rest to the test binary, not
# cargo: libtest stops a test target at its first failing test. A caught
# mutant's suite is mostly spent finishing tests whose verdict the failure
# already decided, and this cuts that; the timeout budget alone still
# bounds a hanging mutant. The flag is nightly-only (stable libtest:
# "only accepted on the nightly compiler with -Z unstable-options"), so
# every lane that runs mutants also installs and exports the pinned
# nightly in PIXEL_MUTANTS_TOOLCHAIN — the workflow install steps and
# scripts/mutants-preflight.sh --run, which is also what the pre-push gate
# executes under PIXEL_MUTANTS_GATE=local. `cargo mutants --list` never runs tests, so the listing
# lanes stay on whatever toolchain they have. None of this changes which
# mutants are generated. Nightlies after 2025-09-18 carry the flag
# (rust-lang/rust#142859); the pin moves with the workflow's
# cargo-mutants pin, and a rust-toolchain file is deliberately not added
# (the rest of the repo builds on stable).
additional_cargo_test_args = ["--all-targets", "--", "-Zunstable-options", "--fail-fast"]
