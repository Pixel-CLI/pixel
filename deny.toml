# cargo-deny policy (https://embarkstudios.github.io/cargo-deny/). CI runs
# `cargo deny check` on every push and pull request (the `deny` job in
# .github/workflows/ci.yml); locally: `cargo install --locked cargo-deny`,
# then `cargo deny check`. Every exception below states why it exists, so a
# reader can tell a decision from an oversight; remove one when its reason
# no longer holds (cargo-deny warns about an unused entry).

[graph]
# The targets pixel is built and tested for: the release matrix
# (release-build.yml: two musl targets and Apple Silicon), CI (x86_64 Linux) and
# Intel Macs. Restricting the graph drops the Windows-only crates, whose
# four parallel `windows-sys` majors would otherwise dominate the
# duplicate report for a platform nothing here builds.
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]
# Checking with everything on covers the union of the release lanes.
all-features = true

[advisories]
version = 2
yanked = "deny"
# osv-scanner.toml repeats this list for OpenSSF Scorecard, which reads that
# file and not this one; scripts/ci/check-advisory-ignores.py (the `deny` CI
# job) fails when the two lists differ.
ignore = [
    # `paste` (a proc-macro, compile time only) is pulled in by `tokenizers`,
    # which `model2vec-rs` needs to embed text for `pixel search-meaning`: the
    # optional `semantic` feature, off in the default build. No safe upgrade
    # exists; the crate is unmaintained, not vulnerable.
    { id = "RUSTSEC-2024-0436", reason = "paste is a compile-time macro under tokenizers (optional semantic feature); unmaintained, no known vulnerability" },
]

[licenses]
version = 2
# Permissive licences only. Anything not listed here fails the check, so a
# new copyleft dependency is a deliberate edit to this file.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "Unicode-3.0",
    "Unlicense",
    "CC0-1.0",
    # webpki-roots: the Mozilla root certificate list `pixel classify` and
    # `pixel index unpack` trust for https (through ureq/rustls).
    "CDLA-Permissive-2.0",
]
# Unrecognised licence texts count as a failure below this confidence.
confidence-threshold = 0.8

# libfuzzer-sys vendors LLVM's libFuzzer, under the University of
# Illinois/NCSA licence (`(MIT OR Apache-2.0) AND NCSA`). Only the fuzz/
# workspace depends on it (fuzz.yml checks that workspace with this file);
# nothing pixel ships links it.
[[licenses.exceptions]]
crate = "libfuzzer-sys"
allow = ["NCSA"]

[licenses.private]
ignore = true

[bans]
# Two majors of one crate double the compile time and the audit surface for
# nothing. Denied by default; the exceptions below are the ones pixel cannot
# resolve from its side.
multiple-versions = "deny"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
skip = [
    # ring (rustls, under ureq) is on getrandom 0.2; proptest and tempfile are
    # on 0.4. Neither side can move from here.
    { crate = "getrandom@0.2.17", reason = "ring 0.17 pins getrandom 0.2" },
    # yaml-edit's rowan pins hashbrown 0.14; rusqlite's hashlink and indexmap
    # use 0.17.
    { crate = "hashbrown@0.14.5", reason = "rowan (yaml-edit) pins hashbrown 0.14" },
    # The optional `semantic` feature pulls in tokenizers (through model2vec-rs),
    # which is on older majors of these than the rest of the tree.
    { crate = "base64@0.13.1", reason = "spm_precompiled (tokenizers) pins base64 0.13" },
    { crate = "getrandom@0.3.4", reason = "ahash and rand 0.9 (tokenizers) are on getrandom 0.3" },
    { crate = "rand_core@0.9.5", reason = "rand 0.9 (tokenizers) is on rand_core 0.9; proptest is on 0.10" },
    { crate = "syn@2.0.119", reason = "derive_builder, monostate and zerocopy-derive (tokenizers) are on syn 2" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
