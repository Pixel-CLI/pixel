{{ $home := "" | relURL }}
<header class="nav">
  <div class="nav__inner wrap">
    <a class="brand" href="{{ if .IsHome }}#main{{ else }}{{ $home }}{{ end }}" aria-label="Pixel home">
      <span class="brand__pixel" aria-hidden="true"></span>
      <span class="brand__name">pixel</span>
    </a>
    <span class="nav__progress" aria-hidden="true"></span>
    <nav class="nav__links" aria-label="Primary">
      <a href="{{ "docs/" | relURL }}"{{ if eq .RelPermalink (printf "%sdocs/" $home) }} aria-current="page"{{ end }}>Docs</a>
      <a href="{{ "benchmarks/" | relURL }}"{{ if eq .RelPermalink (printf "%sbenchmarks/" $home) }} aria-current="page"{{ end }}>Benchmarks</a>
      <a aria-label="Pixel on GitHub" class="nav__gh" href="{{ .Site.Params.github_url }}" target="_blank" rel="noopener">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" fill="currentColor"><path fill-rule="evenodd" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
        <span>GitHub</span>
        <span class="nav__stars" title="GitHub stars" hidden>{{ partial "icon.html" (dict "name" "star" "size" 10) }}<span data-gh-stars="{{ .Site.Params.repo }}" data-gh-stars-min="{{ .Site.Params.gh_stars_min | default 0 }}"></span></span>
      </a>
      <a class="nav__cta" href="{{ if .IsHome }}#install{{ else }}{{ "#install" | relURL }}{{ end }}">Install Pixel</a>
    </nav>
  </div>
</header>
