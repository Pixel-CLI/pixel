# The coding agents the site names, in the order the home shows them: the
# hero's four marks and count, the Compatibility grid, the /for/<slug>/
# pages, and the "What pixel install wires" table of /docs/
# (layouts/shortcodes/agents.html). One entry per agent; its mark is
# assets/logos/<logo>.svg.
#
# Every fact here restates crates/pixel-install, the plugin manifests at the
# repository root or the rule files under .cursor/. A pull
# request that changes what `pixel install` writes changes this file too:
# crates/pixel/tests/cli/docs_drift.rs runs a real `pixel install` and
# `pixel install --repo` into empty directories and fails when the files
# they write differ from the `global`, `shared` and `repo` lists below, when
# a `checks` id is not a `pixel doctor` check, or when an agent check of
# `pixel doctor` belongs to no agent.
#
#   wiring  how Pixel reaches the agent:
#             install  `pixel install` writes the agent's own config
#             plugin   the agent's plugin or extension mechanism loads it;
#                      `pixel install` writes nothing for it
#             rules    a rules file the repository ships, copied into the
#                      project by hand
#   global  files `pixel install` writes for this agent, from the home
#           directory (`~/`); a trailing `/` is a directory Pixel owns
#   when    the condition `pixel install` checks before writing them
#   wires   one Markdown line: what those files do (the /docs/ table)
#   note    Markdown: one more paragraph under "What pixel install writes"
#   repo    files `pixel install --repo` writes for it, from the repository
#   repo_note  Markdown: one more paragraph under "Per repository"
#   plugin  Markdown: the plugin command, when the agent has one
#   rules   the rules file to copy, from the repository root
#   checks  the `pixel doctor` check ids that judge this agent's wiring
#   lede    Markdown: the /for/<slug>/ page's opening line
#
# Text fields are Markdown rendered inline; a `pixel <command>` in them must
# exist (docs_drift.rs reads this file).

# Written by every `pixel install`, whichever agents are present: the agent
# legacy prompt assets used by other integrations and explicit manual setup.
shared = ["~/.local/share/pixel/agent-prompt.md", "~/.local/share/pixel/subagent-prompt.md", "~/.pixel/config.yaml"]

# Repo-wide install artifacts and doctor checks, not owned by one agent entry.
repo_shared = ["AGENTS.md"]
repo_shared_checks = ["repo.warp-mcp", "repo.pixel-first", "repo.task-hook-observations"]

[[agent]]
slug = "claude-code"
name = "Claude Code"
logo = "claude"
wiring = "install"
lede = "`pixel install` preserves task lifecycle hooks while removing automatic retrieval prompts and advice. The optional plugin exposes a focused impact skill; ordinary searches remain native."
global = ["~/.claude/settings.json"]
wires = "task lifecycle hooks in `~/.claude/settings.json`; retired Pixel retrieval hooks are removed and foreign hooks are preserved"
repo = [".claude/settings.local.json", ".claude/pixel-rtk-hooks.json"]
plugin = "`/plugin marketplace add Pixel-CLI/pixel`, then `/plugin install pixel@pixel`: an explicit impact skill without automatic retrieval hooks"
checks = ["install.claude-hooks", "repo.claude-hooks"]

[[agent]]
slug = "codex"
name = "Codex"
logo = "codex"
wiring = "install"
lede = "`pixel install` removes retired Pixel prompt and metrics hooks while retaining task lifecycle controls. The optional plugin exposes an explicit impact skill; ordinary searches remain native."
global = ["~/.codex/config.toml", "~/.codex/hooks.json"]
when = "in `$CODEX_HOME` instead of `~/.codex` when that variable is set"
wires = "task lifecycle hooks in `hooks.json`; removes Pixel's retired `developer_instructions` block while preserving foreign instructions"
repo = [".codex/config.toml", ".codex/hooks.json", ".codex/pixel-composed-guard-backup.json"]
repo_note = "Codex has no personal project file, so repository hook updates are skipped when Git tracks `.codex/hooks.json`: they would carry this machine's path into every clone. Existing owned composed hooks are migrated back to their original registrations."
plugin = "`codex plugin marketplace add Pixel-CLI/pixel`, then `codex plugin add pixel@pixel`"
checks = ["install.codex-config", "install.codex-metrics-hook", "install.codex-hook-review", "repo.codex-config", "repo.codex-hooks", "repo.codex-hook-review"]

[[agent]]
slug = "pi"
name = "Pi"
logo = "pi"
wiring = "install"
lede = "`pixel install` exposes the explicit `/pixel-impact <symbol>` extension command and removes the retired Pixel system-prompt block. The project adapter retains task lifecycle controls."
global = ["~/.pi/agent/extensions/pixel-impact.ts"]
wires = "an explicit `/pixel-impact` command; no automatic retrieval calls or model tools by default"
repo = [".pi/extensions/pixel-guard.ts"]
repo_note = "Pi loads the extension once it trusts the project."
plugin = "`pi install git:github.com/Pixel-CLI/pixel`"
checks = ["install.pi-prompt", "install.pi-impact", "repo.pi-guard"]

[[agent]]
slug = "cursor"
name = "Cursor"
logo = "cursor"
wiring = "rules"
lede = "`pixel install` does not touch Cursor. The repository ships a Cursor rule that always applies: copy it into your project."
rules = ".cursor/rules/pixel.mdc"

[[agent]]
slug = "copilot-cli"
name = "Copilot CLI"
logo = "copilot"
wiring = "plugin"
lede = "`pixel install` does not touch Copilot CLI. Pixel reaches it as a plugin, from the same manifest as Claude Code's (`.claude-plugin/plugin.json`)."
plugin = "`copilot plugin marketplace add Pixel-CLI/pixel`, then `copilot plugin install pixel@pixel`"

[[agent]]
slug = "opencode"
name = "OpenCode"
logo = "opencode"
wiring = "install"
lede = "`pixel install` puts Pixel's protocol into OpenCode's global `AGENTS.md`, the one instruction file both OpenCode generations load, and drops a guard plugin into the plugins directory OpenCode auto-loads."
global = ["~/.config/opencode/AGENTS.md", "~/.config/opencode/plugins/pixel.js"]
when = "only when OpenCode's config directory exists: `$XDG_CONFIG_HOME/opencode`, else `~/.config/opencode`"
wires = "the prompt appended to `AGENTS.md`, and the `tool.execute.before` plugin"
note = "Your own instructions in that `AGENTS.md` stay: Pixel owns only the block between its `pixel:managed` markers. When the file does not exist yet and `~/.claude/CLAUDE.md` does, the new file starts with that content, since on OpenCode's first generation a global `AGENTS.md` takes the place of the `CLAUDE.md` fallback. The plugin is what makes the protocol binding rather than advisory: `AGENTS.md` asks, and OpenCode is the one supported agent whose hook can refuse the call, so `rg` becomes `pixel search-like-rg` and an off-manifest repository read is stopped. It carries the same managed markers, so `pixel uninstall` removes it and a `pixel.js` you wrote yourself is left alone. Nothing needs registering in `opencode.json` — OpenCode auto-loads that directory."
checks = ["install.opencode-agents-md"]

[[agent]]
slug = "devin"
name = "Devin"
logo = "devin"
wiring = "install"
lede = "`pixel install` adds Devin's own lifecycle hooks when Devin has been used on the machine (Devin imports Claude's hooks by default, so without them its sessions get the imported Claude text), and `pixel install --repo` adds a guard to one repository."
global = ["~/.config/devin/config.json"]
when = "only when `~/.config/devin` exists"
wires = "`SessionStart` and `UserPromptSubmit` hooks with `--provider devin`, plus a `PostCompaction` hook, in `~/.config/devin/config.json`"
repo = [".devin/config.local.json"]
plugin = "add `github.com/Pixel-CLI/pixel` as a Devin plugin"
checks = ["install.devin-hooks", "repo.devin-hooks"]

[[agent]]
slug = "antigravity"
name = "Antigravity"
logo = "antigravity"
wiring = "install"
lede = "`pixel install` deploys a Pixel plugin into Antigravity's config, enables it, and registers its guard hooks."
global = ["~/.gemini/config/plugins/pixel/", "~/.gemini/config/config.json", "~/.gemini/antigravity-cli/plugins/pixel/plugin.json", "~/.gemini/antigravity-cli/plugins/pixel/hooks.json", "~/.gemini/antigravity-cli/plugins/pixel/rules/AGENTS.md", "~/.gemini/antigravity-cli/plugins/pixel/skills/pixel/SKILL.md", "~/.gemini/config/import_manifest.json"]
when = "only when Antigravity's config directory, `~/.gemini/config`, exists"
wires = "the Pixel plugin deployed and enabled, and its guard hooks registered"
note = "The plugin carries the prompt once, as a rule; its skill only points to it, and its hooks replace the global `pixel-guard` older installs wrote in `~/.gemini/config/hooks.json`. In an indexed workspace, its `PreInvocation` hook runs a bounded Pixel search for the initial request and delivers the actual results as an `ephemeralMessage` before the model calls native tools. AGY 1.2.13 rejects injected `toolCall` steps, so Pixel executes the search inside the hook. Missing search terms, unavailable indexes and failed or empty searches leave native retrieval available. `PreToolUse` still runs Pixel's guard before `run_command`, `grep_search`, `find_by_name` and `view_file`."
checks = ["install.antigravity"]
