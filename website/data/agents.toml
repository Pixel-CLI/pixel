# The coding agents the site names, in the order the home shows them: the
# hero's four marks and count, the Compatibility grid, the /for/<slug>/
# pages, and the "What pixel install wires" table of /docs/
# (layouts/shortcodes/agents.html). One entry per agent; its mark is
# assets/logos/<logo>.svg.
#
# Every fact here restates crates/pixel-install, the plugin manifests at the
# repository root or the rule files under .cursor/. A pull
# request that changes what `pixel install` writes changes this file too:
# crates/pixel/tests/cli/docs_drift.rs runs a real `pixel install` and
# `pixel install --repo` into empty directories and fails when the files
# they write differ from the `global`, `shared` and `repo` lists below, when
# a `checks` id is not a `pixel doctor` check, or when an agent check of
# `pixel doctor` belongs to no agent.
#
#   wiring  how Pixel reaches the agent:
#             install  `pixel install` writes the agent's own config
#             plugin   the agent's plugin or extension mechanism loads it;
#                      `pixel install` writes nothing for it
#             rules    a rules file the repository ships, copied into the
#                      project by hand
#             none     nothing: the agent keeps its native tools, and
#                      `pixel install` only removes what an earlier release
#                      wrote for it
#   global  files `pixel install` writes for this agent, from the home
#           directory (`~/`); a trailing `/` is a directory Pixel owns
#   when    the condition `pixel install` checks before writing them
#   wires   one Markdown line: what those files do (the /docs/ table)
#   note    Markdown: one more paragraph under "What pixel install writes"
#   repo    files `pixel install --repo` writes for it, from the repository
#   repo_note  Markdown: one more paragraph under "Per repository"
#   plugin  Markdown: the plugin command, when the agent has one
#   rules   the rules file to copy, from the repository root
#   checks  the `pixel doctor` check ids that judge this agent's wiring
#   lede    Markdown: the /for/<slug>/ page's opening line
#
# Text fields are Markdown rendered inline; a `pixel <command>` in them must
# exist (docs_drift.rs reads this file).

# Written by every `pixel install`, whichever agents are present. No agent
# prompt is deployed: install removes the copies earlier releases wrote.
shared = ["~/.pixel/config.yaml"]

# Repo-wide install artifacts and doctor checks, not owned by one agent entry.
repo_shared = ["AGENTS.md"]
repo_shared_checks = ["repo.warp-mcp", "repo.pixel-first", "repo.task-hook-observations"]

[[agent]]
slug = "claude-code"
name = "Claude Code"
logo = "claude"
wiring = "install"
lede = "`pixel install` preserves task lifecycle hooks while removing automatic retrieval prompts and advice. Each code prompt gets a bounded evidence brief; ordinary searches remain native. The optional plugin ships no skill or hook."
global = ["~/.claude/settings.json"]
wires = "task lifecycle hooks in `~/.claude/settings.json`; retired Pixel retrieval hooks are removed and foreign hooks are preserved"
repo = [".claude/settings.local.json", ".claude/pixel-rtk-hooks.json"]
plugin = "`/plugin marketplace add Pixel-CLI/pixel`, then `/plugin install pixel@pixel`: ships no skill or hook; `pixel install` wires the per-prompt brief"
checks = ["install.claude-hooks", "repo.claude-hooks"]

[[agent]]
slug = "codex"
name = "Codex"
logo = "codex"
wiring = "install"
lede = "`pixel install` removes retired Pixel prompt and metrics hooks while retaining task lifecycle controls. Each code prompt gets a bounded evidence brief; ordinary searches remain native. The optional plugin ships no skill or hook."
global = ["~/.codex/config.toml", "~/.codex/hooks.json"]
when = "in `$CODEX_HOME` instead of `~/.codex` when that variable is set"
wires = "task lifecycle hooks in `hooks.json`; removes Pixel's retired `developer_instructions` block while preserving foreign instructions"
repo = [".codex/config.toml", ".codex/hooks.json", ".codex/pixel-composed-guard-backup.json"]
repo_note = "Codex has no personal project file, so repository hook updates are skipped when Git tracks `.codex/hooks.json`: they would carry this machine's path into every clone. Existing owned composed hooks are migrated back to their original registrations."
plugin = "`codex plugin marketplace add Pixel-CLI/pixel`, then `codex plugin add pixel@pixel`"
checks = ["install.codex-config", "install.codex-metrics-hook", "install.codex-hook-review", "repo.codex-config", "repo.codex-hooks", "repo.codex-hook-review"]

[[agent]]
slug = "pi"
name = "Pi"
logo = "pi"
wiring = "install"
lede = "`pixel install` gives Pi the explicit `/pixel-impact <symbol>` command as a local Pi package and adds a bounded evidence brief to each prompt. Pi keeps its native tools."
global = ["~/.local/share/pixel/pi-package/package.json", "~/.local/share/pixel/pi-package/extensions/pixel-impact.ts", "~/.local/share/pixel/pi-package/extensions/pixel-brief.ts", "~/.pi/agent/settings.json"]
when = "when Pi's agent directory (`$PI_CODING_AGENT_DIR`, else `~/.pi/agent`) exists or `pi` is on PATH"
wires = "an explicit `/pixel-impact` command from a local package declared in the `packages` list of Pi's settings; no automatic retrieval, tool or prompt"
note = "Your other Pi settings and packages stay: Pixel adds only its package path to `packages`, and `pixel uninstall` takes it out again. A copy of the command an earlier release put in `extensions/` is removed, so Pi does not list it twice. Installing the npm package with `pi install` as well registers the command a second time: use one or the other."
repo_note = "`pixel install --repo .` writes nothing for Pi: it removes the `.pi/extensions/pixel-guard.ts` an earlier release wrote."
plugin = "`pi install git:github.com/Pixel-CLI/pixel`"
checks = ["install.pi-prompt", "install.pi-impact", "repo.pi-guard"]

[[agent]]
slug = "cursor"
name = "Cursor"
logo = "cursor"
wiring = "rules"
lede = "`pixel install` writes nothing for Cursor; it removes the hooks an earlier release put in `~/.cursor/hooks.json`. The repository ships an optional Cursor rule you can copy into a project."
rules = ".cursor/rules/pixel.mdc"

[[agent]]
slug = "copilot-cli"
name = "Copilot CLI"
logo = "copilot"
wiring = "plugin"
lede = "`pixel install` writes nothing for Copilot CLI; it removes the `~/.copilot/hooks/pixel.json` an earlier release wrote. Pixel is available as an optional plugin, from the same manifest as Claude Code's (`.claude-plugin/plugin.json`)."
plugin = "`copilot plugin marketplace add Pixel-CLI/pixel`, then `copilot plugin install pixel@pixel`"

[[agent]]
slug = "opencode"
name = "OpenCode"
logo = "opencode"
wiring = "install"
lede = "OpenCode keeps its native tools; `pixel install` adds a bounded evidence brief to each prompt and removes the `AGENTS.md` block and guard plugin an earlier release put in OpenCode's config directory."
global = ["~/.config/opencode/plugins/pixel-brief.js"]
wires = "a per-prompt evidence brief from the auto-loaded `plugins/pixel-brief.js`; ordinary searches remain native"
note = "Your own instructions in that `AGENTS.md` stay: Pixel removes only the block between its `pixel:managed` markers, and the file when nothing else was in it. A `plugins/pixel.js` you wrote yourself is left alone."
checks = ["install.opencode-agents-md"]

[[agent]]
slug = "devin"
name = "Devin"
logo = "devin"
wiring = "plugin"
lede = "Devin keeps its native tools; `pixel install` adds a bounded evidence brief to each prompt and removes retired lifecycle hooks from `~/.config/devin/config.json`; `pixel install --repo` removes the repository guard from `.devin/config.local.json`."
global = ["~/.config/devin/config.json"]
wires = "a per-prompt evidence brief through Devin's `UserPromptSubmit` hook; native tools stay unchanged"
plugin = "add `github.com/Pixel-CLI/pixel` as a Devin plugin"
checks = ["install.devin-hooks", "repo.devin-hooks"]

[[agent]]
slug = "antigravity"
name = "Antigravity"
logo = "antigravity"
wiring = "none"
lede = "Antigravity keeps its native tools: `pixel install` writes nothing for it, and removes the Pixel plugin, its `config.json` entry and the global `pixel-guard` an earlier release registered."
note = "A `pixel-guard` you defined yourself in `~/.gemini/config/hooks.json` stays. When the `agy` CLI is on PATH, the plugin registration is removed through it."
checks = ["install.antigravity"]
