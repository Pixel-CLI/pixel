# The tools Pixel is compared with: the home's "Alternatives" cards (the
# tools marked `home`) and every page under /vs/ (content/vs/<slug>.md names
# its tool with `tool = "<slug>"`). `layouts/partials/alternatives.html`
# fills the placeholders and returns the list to both, so a card and its
# page cannot disagree.
#
# Every figure restates content/benchmarks.md (or data/read_savings.toml,
# which it reads): change it there first, then here, and never a figure it
# does not show. A tool that page does not measure gets a page only as
# `measure = "design"`: no figure at all (no digit in its answer, wins or
# rows, and no `bench`), and "Not benchmarked" above its table. The partial
# fails the build otherwise.
#
# Per tool:
#   slug, name     the page's path (/vs/<slug>/) and the tool's display name
#   column         the table's column header, when `name` does not fit one
#   home           a card in the home's Alternatives chapter, in this order
#   pitch          the card's subtitle (home only)
#   about          what the tool is, one sentence (the pages)
#   measure        how the figures were obtained, shown above the table:
#                    head-to-head      both tools, same cases, same machine
#                    published-figure  Pixel's measurement beside the other
#                                      tool's own published figure: different samples
#                    baseline          the other tool is the baseline the measurement
#                                      starts from (grep's match, then the file read)
#                    design            no benchmark: how the two work, no figure
#   bench          the section of /benchmarks/ the figures come from (anchor)
#   answer         the short answer at the top of the page, HTML
#   wins           where the other tool wins, HTML (the card's note and the page)
#   note_label,    the card's note, when it is not "Where <name> wins: <wins>"
#   note
#   more           the card's link label; `more_href` replaces the link to
#                  /benchmarks/#<bench> on the card
#   checked        the day the rows were last checked against /benchmarks/;
#                  the page's "Updated" date is the later of it and its Git date
#   matrix         a column of the home's matrix, in this order (the code
#                  indexes); it then fills every `traits` key
#   [tool.traits]  the matrix's shared rows, plain words: how (how it answers),
#                  needs (what it takes to run), reach (how an agent calls it),
#                  history (Git history), licence (an SPDX-style name, the one
#                  trait a design entry may spell with digits)
#   [[tool.row]]   label, pixel, other; win = "pixel" or "other" marks the cell;
#                  matrix = "callers" or "context" also shows the row in the
#                  matrix, where a matrix tool without it reads "Not measured";
#                  page = true keeps a row off the home card; page_other
#                  replaces `other` on the page when the card quotes a figure
#                  /benchmarks/ does not carry
#
# Placeholders, filled by the partial (an unknown one fails the build):
#   {bench}        the /benchmarks/ page
#   {kept.range}   the kept rows of data/read_savings.toml: "79.7 to 97.1%",
#   {kept.count}     how many there are,
#   {kept.median}    and their median, formatted as on /benchmarks/
#   {big.owner}    the token wall's row (partials/wall-row.html): its owner,
#   {big.file}       file name, line count, tokens of the full read and
#   {big.lines}      tokens through Pixel
#   {big.full}
#   {big.pixel}

