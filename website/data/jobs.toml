# The six before/after animations from the README, in its order. `media` is
# a basename in docs/examples/ (mounted at /examples/ by hugo.toml): the page
# plays <media>.mp4 with <media>.jpg as its poster, and the README shows
# <media>.webp. docs/motion/scripts/render.sh writes all three.
[[job]]
id = "scope"
name = "Scope before reading"
command = "pixel scope-task"
text = "A closed P0/P1/P2 file list, not an agent wandering the repository."
media = "pixel-scope-comparison"

[[job]]
id = "measured"
name = "Read skeletons, not files"
command = "pixel list-signatures"
text = "Signatures fitted to a token budget, instead of whole-file reads."
media = "pixel-measured-comparison"

[[job]]
id = "impact"
name = "Impact before edit"
command = "pixel impact"
text = "Every caller of a symbol, listed before the agent touches it."
media = "pixel-impact-comparison"

[[job]]
id = "rewrite"
name = "Search stays familiar"
command = "pixel search-content"
text = "The hook turns rg and grep into indexed search. Same command."
media = "pixel-rewrite-comparison"

[[job]]
id = "rollback"
name = "Rescue as a plan"
command = "pixel plan-rollback"
text = "Flags the likely breaking commit and the last good one. Resets nothing."
media = "pixel-rollback-comparison"

[[job]]
id = "publish"
name = "Publish without footguns"
command = "pixel commit-and-push"
text = "Review, then a leased push designed to be crash-safe. Never a raw --force."
media = "pixel-publish-comparison"
