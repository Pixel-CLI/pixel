# The "Fair questions" chapter of the landing page, and the FAQPage in its
# JSON-LD: one source, so what an assistant reads in the markup is what a
# visitor reads on the page. `layouts/partials/objections.html` renders it
# for both.
#
# Each `answer` is a list of paragraphs, in HTML. A figure that lives
# elsewhere is never written here: it is a placeholder the partial fills in,
# and an unknown placeholder fails the build.
#
#   {bench}        the /benchmarks/ page (relative on the page, absolute in the JSON-LD)
#   {github}       site.Params.github_url
#   {big.owner}    the token wall's row of data/read_savings.toml: its owner,
#   {big.file}       file name,
#   {big.lines}      line count,
#   {big.full}       tokens of the full read,
#   {big.pixel}      and tokens through Pixel (numbers formatted as on the page)
#   {langs.count}  the code graph's grammars (partials/objections.html, from
#   {langs.list}     crates/pixel-graph/src/extract.rs): their count, their list
#
#   audience  "dev" or "team": the column of the home's chapter it sits in
#             (questions a developer asks, questions whoever approves it asks)
#   check     HTML, optional: the "Check it" line under the answer on the
#             home, a command the visitor runs or the measurement it rests
#             on; placeholders work there too. The FAQPage and /vs/ read
#             the answer only.
#
# The other facts restate SECURITY.md, docs/bench/measured-performance.md
# and content/benchmarks.md: change an answer when they change.

[[objection]]
question = "Will my agent actually use it?"
audience = "dev"
answer = [
  '''Not every time: agents fall back to <code>grep</code>. <code>pixel install</code> puts Pixel's protocol into every session, and <code>pixel install --repo</code> adds a guard that flags untargeted reads of large files; it advises, never blocks. In one Opus 5.5 medium trial on a low-research scoping task, hooks were slower (+11%), with more tokens read (+12%) and higher provider-reported API cost (+31%). This is not a general result. <a class="link" href="{bench}#on-whole-agent-tasks">Method and limits</a>''',
]
check = '''<code>pixel action-log</code> what Pixel ran in this repository, and how it went'''

[[objection]]
question = "Why not just grep?"
audience = "dev"
comparison = true
answer = [
  '''Grep finds the line; the agent then opens the file around it. On {big.owner} {big.lines}-line {big.file}, the whole file is {big.full} estimated tokens against {big.pixel} for its signatures (UTF-8 bytes ÷ 4), a volume, not a session cost. <code>pixel search-content</code> keeps grep's regex syntax.''',
]
check = '''<code>pixel audit</code> the same comparison on your twenty largest files'''

[[objection]]
question = "Why not a language server or my editor's index?"
audience = "dev"
comparison = true
answer = [
  '''A language server resolves types, so its callers are more exact than a syntax graph's, but it needs one running server per language; an editor's index lives inside that editor. Pixel is one binary every agent on this page shares, covers {langs.count} languages and your Git history, and says when an answer may be incomplete.''',
]
check = '''<code>pixel impact &lt;symbol&gt;</code> each caller marked exact or probable'''

[[objection]]
question = "Does anything leave my machine?"
audience = "team"
answer = [
  '''Nothing you did not ask for: no telemetry, and the index stays in <code>.pixel/</code>. The network carries the embedding model's first download, your Git remotes, the two opt-in commands that call a service you configure (<code>pixel classify</code>, <code>pixel web-search</code>), and a daily release check in an interactive terminal (<code>PIXEL_NO_UPDATE_CHECK=1</code> turns it off). <a class="link" href="{github}/blob/main/SECURITY.md" target="_blank" rel="noopener">Security model</a>''',
]
check = '''<code>pixel config</code> every setting and the file it comes from'''

[[objection]]
question = "How do I remove it?"
audience = "team"
answer = [
  '''<code>pixel uninstall</code> removes every block, hook and file <code>pixel install</code> wrote, then the binary; <code>pixel uninstall --repo</code> does the same for one repository. The index is the <code>.pixel/</code> folder: delete it.''',
]
check = '''<code>pixel uninstall --dry-run</code> the list, before anything is removed'''

[[objection]]
question = "Pixel or semble?"
audience = "team"
comparison = true
answer = [
  '''Both, if you search in plain English a lot. On 45 natural-language queries, semble has the right file in its top 10 for 100%, Pixel for 96%; Pixel puts it first more often, 87% against 64%, and adds the call graph, blast radius, Git history and guarded Git writes.''',
]
check = '''<a class="link" href="{bench}#where-a-specialist-wins">Where a specialist wins</a> the queries and both tools' results'''
