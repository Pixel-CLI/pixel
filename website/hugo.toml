baseURL = "https://pixel-cli.dev/"
locale = "en-us"
title = "Pixel"
enableRobotsTXT = true
# Each page's .Lastmod is the date of the last commit that touched its source
# file: the sitemap's lastmod and the "Updated" line under the docs titles.
# The Pages workflow checks out the full history for it (fetch-depth: 0).
enableGitInfo = true
disableKinds = ["taxonomy", "term", "RSS"]

[params]
description = "A local code index that gives coding agents a map of your repository and reduces whole-file reads. Try it on your own code; evidence and limits are documented."
github_url = "https://github.com/Pixel-CLI/pixel"
repo = "Pixel-CLI/pixel"
# The nav shows the repository's GitHub star count only from this many up:
# below it the badge stays hidden (layouts/partials/footer.html). 0 always
# shows it.
gh_stars_min = 100
# Cloudflare Web Analytics site token (Cloudflare dashboard, Web Analytics,
# pixel-cli.dev). Public by design: it ships in every page. Empty means no
# beacon and no analytics line in the footer.
cf_beacon = "22e9d7c09c674b8ea63b3ca0a829d33a"

[markup.goldmark.renderer]
unsafe = true

[markup.highlight]
noClasses = false

[markup.tableOfContents]
startLevel = 2
endLevel = 2

[outputs]
home = ["HTML"]

# The animations live in docs/examples/, rendered by docs/motion. Mounting
# them keeps one copy of each file instead of two; the page uses the MP4s and
# their JPEG posters, the README the WebPs. Declaring a static mount drops
# Hugo's default one, so static/ is mounted again first.
[[module.mounts]]
source = "static"
target = "static"

[[module.mounts]]
source = "../docs/examples"
target = "static/examples"
files = ["**.mp4", "**.jpg"]

# The CLI crate's manifest, read as data (hugo.Data.cli.package.version) for
# the JSON-LD's softwareVersion: the release's prepare.sh bumps it, so the
# site never carries a second copy of the version. As with static/, a data
# mount drops the default one, so data/ is mounted again first.
[[module.mounts]]
source = "data"
target = "data"

[[module.mounts]]
source = "../crates/pixel/Cargo.toml"
target = "data/cli.toml"
