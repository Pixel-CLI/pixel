<!DOCTYPE html>
<!-- The share card (assets/og.png), 1200x630. Not part of the site: render.sh
     fills DATA from data/read_savings.toml (the row marked `wall`), opens
     this page at exactly 1200x630 and screenshots it. The colours and faces
     are the site's (assets/css/main.css): coral is the tokens a full read
     wastes, green what Pixel hands back.

     Two renderings decide the layout. Slack's compact unfurl, iMessage and
     WhatsApp crop the card to the centred square (x 285 to 915) and draw it
     at about 80 px, so the brand and the headline live in that square. The
     large unfurls draw it about 360 px wide, a third of its size, so no text
     is smaller than 40 px and nothing carries meaning at low contrast. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pixel share card</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400..700&family=Handjet:ELGR,ELSH,wght@1..2,0..2,700&family=IBM+Plex+Mono:wght@400;500;600&display=block">
<style>
  :root {
    --ground: #0b1f17; --panel: #133426; --ink: #ecf7ef; --ink-soft: #93b3a0;
    --green: #22c55e; --green-hi: #4ade80; --coral: #f0775a; --on-green: #04210e;
    --display: "Handjet", "Archivo", sans-serif; --mono: "IBM Plex Mono", monospace;
    --px: "ELSH" 2, "ELGR" 1.5;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative; background: radial-gradient(ellipse 60% 75% at 50% 50%, #133a28 0%, var(--ground) 70%);
    color: var(--ink); -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
  }
  /* The side fields: coral squares thinning out towards the middle on the
     left, green ones on the right. Outside the centred square, so a
     cropped thumbnail loses them and nothing else. */
  .field { position: absolute; top: 0; bottom: 0; width: 300px; display: grid; grid-template-columns: repeat(14, 1fr); align-content: center; gap: 5px; padding: 0 22px; }
  .field--waste { left: 0; }
  .field--kept { right: 0; }
  .field span { aspect-ratio: 1; border-radius: 2px; }
  .field--waste span.on { background: var(--coral); }
  .field--kept span.on { background: var(--green); box-shadow: 0 0 10px rgba(34, 197, 94, 0.45); }
  .core { position: relative; display: flex; flex-direction: column; align-items: center; }
  .brand { display: flex; align-items: center; gap: 16px; }
  .brand i { width: 38px; height: 38px; border-radius: 7px; background: var(--green); box-shadow: inset 0 0 0 3px #16a34a, 0 0 24px rgba(34, 197, 94, 0.5); }
  .brand b { font: 700 76px/1 var(--display); font-variation-settings: var(--px); }
  h1 { margin-top: 26px; font: 700 132px/0.9 var(--display); font-variation-settings: var(--px); }
  .glow { color: var(--green-hi); text-shadow: 0 0 22px rgba(74, 222, 128, 0.55), 0 0 60px rgba(34, 197, 94, 0.3); }
  .count { margin-top: 34px; display: flex; align-items: center; gap: 16px; white-space: nowrap; font: 700 58px/1 var(--display); font-variation-settings: var(--px); font-variant-numeric: tabular-nums; }
  .count s { color: var(--coral); text-decoration: none; }
  .count em { font-style: normal; color: var(--green-hi); }
  .count span { color: var(--ink-soft); }
  .method { margin-top: 20px; font: 500 24px/1.2 var(--mono); color: var(--ink-soft); }
  .count small { font: 600 40px/1 var(--mono); padding: 6px 12px; border-radius: 6px; color: var(--on-green); background: var(--green); }
</style>
</head>
<body>
  <div class="field field--waste" data-field="waste"></div>
  <div class="field field--kept" data-field="kept"></div>
  <div class="core">
    <p class="brand"><i></i><b>pixel</b></p>
    <h1>Read less.<br><span class="glow">Code more.</span></h1>
    <p class="count"><s data-full></s><span>&rarr;</span><em data-pixel></em><span>est. tokens</span><small data-saved></small></p>
    <p class="method">Whole file → signatures · bytes ÷ 4</p>
  </div>
<script>
  /*DATA*/
  (function () {
    var d = window.DATA;
    var fmt = function (v) { return v.toLocaleString('en-US'); };
    document.querySelector('[data-full]').textContent = fmt(d.full);
    document.querySelector('[data-pixel]').textContent = fmt(d.pixel);
    // Floored, as the home page's wall and its stats round it.
    document.querySelector('[data-saved]').textContent = '−' + Math.floor(d.saved) + '%';

    // Each field is 14 columns of squares; a square is lit with a
    // probability, and drawn with an opacity, that fall towards the middle
    // of the card. A fixed seed keeps the card identical from one render to
    // the next.
    var seed = 7;
    var rand = function () { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
    var cols = 14, rows = 30;
    document.querySelectorAll('[data-field]').forEach(function (field) {
      var kept = field.getAttribute('data-field') === 'kept';
      for (var y = 0; y < rows; y++) for (var x = 0; x < cols; x++) {
        var outer = kept ? x / (cols - 1) : 1 - x / (cols - 1);
        var c = document.createElement('span');
        if (rand() < Math.pow(outer, 2.2) * (kept ? 0.5 : 0.8)) {
          c.className = 'on';
          c.style.opacity = (0.25 + 0.75 * outer).toFixed(2);
        }
        field.appendChild(c);
      }
    });
    document.fonts.ready.then(function () { document.body.setAttribute('data-ready', ''); });
  })();
</script>
</body>
</html>
