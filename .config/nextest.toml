# cargo-nextest configuration (https://nexte.st/docs/configuration/).
# CI runs `cargo nextest run --workspace --locked --profile ci`; local runs
# use the default profile below. Doctests are not nextest's job: CI keeps a
# separate `cargo test --workspace --doc`.
nextest-version = { required = "0.9.100" }

[profile.default]
# One process per test: process-wide state (env vars, cwd) needs no lock.
# A test binary that is red must not hide the ones after it.
fail-fast = false
# A test taking longer than a minute is a hang, not a slow test (the longest
# CLI contract test here runs in seconds). Warn at 60 s, kill at 180 s.
slow-timeout = { period = "60s", terminate-after = 3 }

[profile.fast]
inherits = "default"
# Local diagnosis only (`cargo nextest run -P fast …`): stop at the first
# failure instead of running the rest. The default stays without fail-fast
# for the reason above; CI never selects this profile.
fail-fast = true

[profile.ci]
inherits = "default"
# One retry surfaces a timing-dependent test as FLAKY in the summary instead
# of a red run for a wobble, and a flaky result still fails the run: a
# retry is telemetry, never a mask.
retries = 1
flaky-result = "fail"
status-level = "retry"
final-status-level = "flaky"

[profile.ci.junit]
path = "junit.xml"

# The upgrade tests drive a fake daemon over a Unix socket with 1.5 s
# client timeouts (`upgrade_daemon_request`). Under nextest's default
# parallelism on a 4-core runner the server thread can be starved past
# that, which failed CI once with "daemon control timed out". Reserve
# every test thread for them so they run alone.
[[profile.default.overrides]]
filter = 'package(pixel-cli) & test(upgrade_cli::)'
threads-required = "num-cpus"
