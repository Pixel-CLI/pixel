name: Release

on:
  push:
    tags:
      - 'v*'

# Build jobs only need to read the checkout. Write access is granted to
# the release job alone (see below), which creates the GitHub release.
permissions:
  contents: read

# Same value as ci.yml and cross-build.yml: rust-cache hashes every CARGO_*
# variable into its key, so a different set here would miss their caches.
env:
  CARGO_TERM_COLOR: always

jobs:
  # Gate: nothing is built or published unless the tag names the version that
  # Cargo.toml declares and the test suite passes on the tagged commit. CI does
  # not run on tag pushes, so this is the only check a release goes through.
  verify:
    name: Verify tag and tests
    runs-on: ubuntu-26.04
    steps:
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1
        with:
          # The job never pushes: do not leave the token in .git/config.
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          # The SHA pin no longer names the toolchain through the ref, so
          # it is passed explicitly (same channel as before).
          toolchain: stable

      # Restores the debug cache ci.yml's Test job saves on main (shared key
      # linux-debug); never saves: a tag's cache is unreadable by the next tag.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: linux-debug
          save-if: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y perl make

      # Tag = crates/pixel version, Cargo.lock fresh for every member,
      # CHANGELOG has the `## [x.y.z]` heading and an empty Unreleased.
      # A stale lock used to surface only in the build job, after the tests.
      # No --locked here on purpose: with it cargo would refuse before the
      # report names the stale member; the build job stays --locked.
      - name: Release consistency (pixel check-release)
        run: cargo run -q -p pixel-cli -- check-release "$GITHUB_REF" --repo .

      - name: Test
        run: cargo test --workspace --locked

  # Build, package and attest in a reusable workflow: the attestation names
  # release-build.yml as its signer, which is what SLSA Build Level 3 asks of
  # the build (see that file). This job only grants it the signing
  # permissions; no secret crosses over.
  assets:
    name: Build and attest
    needs: verify
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/release-build.yml

  release:
    name: Publish release + formula
    needs: assets
    runs-on: ubuntu-26.04
    # Publication only: the signing permissions stay with release-build.yml.
    permissions:
      contents: write
    env:
      # Fine-grained PAT with Contents: read/write on LivioGama/homebrew-tap.
      # When unset, the formula is still attached to the release but the tap
      # is not updated (a warning is emitted instead of failing the release).
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1
        with:
          # The job never pushes: do not leave the token in .git/config.
          persist-credentials: false

      # The files release-build.yml built and attested: archives, their
      # .sha256 and SBOMs (.cdx.json), the Linux bottles, pixel.rb,
      # pixel-core.rb and install.sh, plus the attestation's Sigstore bundle
      # (pixel-<tag>.intoto.jsonl).
      - name: Download the release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-assets
          path: assets

      # The release body is the tag's section of CHANGELOG.md (Keep a
      # Changelog: from "## [X.Y.Z]" to the next "## " heading).
      - name: Extract release notes from CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          awk -v v="$VERSION" '
            /^## \[/ { inside = index($0, "## [" v "]") == 1 }
            inside && index($0, "## [" v "]") != 1 { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::warning::no '## [${VERSION}]' section in CHANGELOG.md; the release body falls back to a link"
            echo "See [CHANGELOG.md](https://github.com/Pixel-CLI/pixel/blob/v${VERSION}/CHANGELOG.md)." > release-notes.md
          fi
          echo "--- release-notes.md ---"
          cat release-notes.md

      - name: Upload release assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          body_path: release-notes.md
          # install.sh ships with the release, not from a branch: main moves
          # ahead of the latest release, and the documented one-liner reads
          # releases/latest/download/install.sh, so it always runs the
          # script of the release it installs.
          # assets/pixel-*.tar.gz matches the archives and the Linux
          # bottles (pixel-*.bottle.tar.gz) alike. pixel-*.intoto.jsonl is
          # the provenance bundle, the file Scorecard's Signed-Releases
          # check looks for. pixel-*.cdx.json is each archive's SBOM.
          files: |
            assets/pixel-*.tar.gz
            assets/pixel-*.tar.gz.sha256
            assets/pixel.rb
            assets/pixel-core.rb
            assets/install.sh
            assets/pixel-*.intoto.jsonl
            assets/pixel-*.cdx.json

      - name: Check out the Homebrew tap
        if: env.HOMEBREW_TAP_TOKEN != ''
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1
        with:
          repository: LivioGama/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Publish formula to the tap
        if: env.HOMEBREW_TAP_TOKEN != ''
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          cp assets/pixel.rb homebrew-tap/Formula/pixel.rb
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/pixel.rb
          if git diff --staged --quiet; then
            echo "Formula/pixel.rb already up to date for ${VERSION}"
            exit 0
          fi
          git commit -m "pixel ${VERSION#v}"
          git push

      - name: Tap not updated (no token)
        if: env.HOMEBREW_TAP_TOKEN == ''
        run: echo "::warning::HOMEBREW_TAP_TOKEN is not set; update Formula/pixel.rb in LivioGama/homebrew-tap by hand from the pixel.rb release asset."

  # Post-publish smoke test: installs what was just published, the ways the
  # README installs it, on each target's own runner, and checks it is the
  # tagged build. `pixel --version` must print `pixel x.y.z` and `commit:
  # <the tag's commit>` (build.rs embeds it, `-dirty` included) from an empty
  # HOME. Nothing before this job ran the aarch64-apple-darwin binary, and
  # nothing ran install.sh or the tap formula at all. A failure here comes
  # after publication: it cannot unpublish, it says the next patch is due.
  smoke:
    name: Smoke ${{ matrix.target }}
    needs: release
    runs-on: ${{ matrix.os }}
    strategy:
      # One broken target must not hide the state of the others.
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-26.04
          - target: aarch64-unknown-linux-musl
            os: ubuntu-26.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
    env:
      GH_TOKEN: ${{ github.token }}
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - name: Write the version check
        run: |
          cat > "$RUNNER_TEMP/check-version.sh" <<'EOF'
          #!/bin/sh
          # check-version.sh <pixel binary> <how it was installed>
          set -eu
          home="$(mktemp -d)"
          out="$(HOME="$home" "$1" --version)"
          printf '%s\n%s\n' "--- $2: $1 --version" "$out"
          if ! printf '%s\n' "$out" | grep -Fqx "pixel ${GITHUB_REF_NAME#v}"; then
            echo "::error::$2: $1 is not pixel ${GITHUB_REF_NAME#v}"
            exit 1
          fi
          if ! printf '%s\n' "$out" | grep -Fqx "commit: ${GITHUB_SHA}"; then
            echo "::error::$2: $1 was not built from ${GITHUB_SHA} (the ${GITHUB_REF_NAME} commit)"
            exit 1
          fi
          EOF
          chmod +x "$RUNNER_TEMP/check-version.sh"

      - name: Release asset (download, checksum, run)
        run: |
          ARCHIVE="pixel-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz"
          DIR="$RUNNER_TEMP/asset"
          mkdir -p "$DIR" && cd "$DIR"
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --pattern "$ARCHIVE" --pattern "$ARCHIVE.sha256"
          shasum -a 256 -c "$ARCHIVE.sha256"
          # Signed by release-build.yml on this tag, on a GitHub-hosted
          # runner: the command SECURITY.md gives users, so a release whose
          # attestation is missing or foreign fails here.
          # The bundle published beside them must verify the same subjects
          # on its own (`--bundle`, SECURITY.md): a missing, empty or foreign
          # pixel-<tag>.intoto.jsonl fails here too, and so does a missing
          # or unsigned SBOM of the archive.
          SBOM="${ARCHIVE%.tar.gz}.cdx.json"
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --pattern install.sh --pattern "pixel-$GITHUB_REF_NAME.intoto.jsonl" \
            --pattern "$SBOM"
          for subject in "$ARCHIVE" "$SBOM" install.sh; do
            gh attestation verify "$subject" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-build.yml" \
              --source-ref "$GITHUB_REF" --deny-self-hosted-runners
            gh attestation verify "$subject" --repo "$GITHUB_REPOSITORY" \
              --bundle "pixel-$GITHUB_REF_NAME.intoto.jsonl" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-build.yml" \
              --source-ref "$GITHUB_REF" --deny-self-hosted-runners
          done
          tar xzf "$ARCHIVE"
          "$RUNNER_TEMP/check-version.sh" "$DIR/pixel-${GITHUB_REF_NAME}-${{ matrix.target }}/bin/pixel" "release asset"

      # The documented one-liner, byte for byte: the install.sh asset of the
      # latest release. Both the script and the binary it installs resolve
      # releases/latest, so it is only checked when this tag is the latest
      # release (a patch on an older line is not).
      - name: install.sh (releases/latest/download)
        run: |
          LATEST="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          if [ "$LATEST" != "$GITHUB_REF_NAME" ]; then
            echo "::notice::latest release is $LATEST, not $GITHUB_REF_NAME; install.sh not checked"
            exit 0
          fi
          curl -fsSL "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/install.sh" \
            | PIXEL_INSTALL_DIR="$RUNNER_TEMP/install-sh" sh
          "$RUNNER_TEMP/check-version.sh" "$RUNNER_TEMP/install-sh/pixel" "install.sh"

      # On Linux the tap must pour the release's bottle: installed from its
      # url instead, the formula counts as a build from source and needs a C
      # compiler. A runner image without Homebrew skips the check.
      - name: Homebrew tap (Linux bottle)
        if: runner.os == 'Linux' && env.HOMEBREW_TAP_TOKEN != ''
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew=/home/linuxbrew/.linuxbrew/bin/brew
          if [ ! -x "$brew" ]; then
            echo "::notice::no Homebrew on this runner image; the Linux bottle is not checked"
            exit 0
          fi
          "$brew" tap LivioGama/tap
          "$brew" install LivioGama/tap/pixel
          poured="$("$brew" info --json=v2 LivioGama/tap/pixel \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["formulae"][0]["installed"][0]["poured_from_bottle"])')"
          if [ "$poured" != True ]; then
            echo "::error::brew installed pixel without pouring its bottle (poured_from_bottle: $poured)"
            exit 1
          fi
          "$brew" deps --installed LivioGama/tap/pixel
          "$RUNNER_TEMP/check-version.sh" "$("$brew" --prefix)/bin/pixel" "brew install LivioGama/tap/pixel (bottle)"

      # macOS is the one target with no other install path than the tap for
      # most users; it has no bottle and installs from its archive.
      - name: Homebrew tap
        if: runner.os == 'macOS' && env.HOMEBREW_TAP_TOKEN != ''
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew tap LivioGama/tap
          brew install LivioGama/tap/pixel
          brew test LivioGama/tap/pixel
          "$RUNNER_TEMP/check-version.sh" "$(brew --prefix)/bin/pixel" "brew install LivioGama/tap/pixel"

  # VirusTotal: submits each release archive and appends a link to its report
  # to the release notes, so a user can check the scan of the exact file they
  # download (a static "0/N" badge would go stale with the next release).
  # Reports are linked by sha256, so a link stays valid as engines re-scan.
  # Runs only when the VT_API_KEY secret is set; the free API allows 4
  # requests a minute, hence the pause between calls. A failure here comes
  # after publication and unpublishes nothing.
  virustotal:
    name: VirusTotal scan
    needs: release
    runs-on: ubuntu-26.04
    permissions:
      # Append the report links to the release notes.
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VT_API_KEY: ${{ secrets.VT_API_KEY }}
    steps:
      - name: No VirusTotal key
        if: env.VT_API_KEY == ''
        run: echo "::notice::VT_API_KEY is not set; the release archives were not submitted to VirusTotal."

      - name: Submit the archives and link their reports
        if: env.VT_API_KEY != ''
        run: |
          set -eu
          DIR="$RUNNER_TEMP/virustotal"
          mkdir -p "$DIR" && cd "$DIR"
          # pixel-v*: the three archives; the bottles (pixel-<version>.*)
          # carry the same binaries as the Linux archives.
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern 'pixel-v*.tar.gz'
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json body --jq .body > notes.md
          if grep -Fqx '### VirusTotal' notes.md; then
            echo "::notice::the release notes already link VirusTotal reports; nothing appended"
            exit 0
          fi
          printf '\n\n### VirusTotal\n\n' > links.md
          # The key goes to curl through a mode-0600 header file, never as an
          # argument another process could read from the process list
          # (printf is a shell builtin, so writing it spawns nothing).
          hdr="$(umask 077 && mktemp)"
          trap 'rm -f "$hdr"' EXIT
          printf 'x-apikey: %s\n' "$VT_API_KEY" > "$hdr"
          for f in pixel-v*.tar.gz; do
            # 32 MB is the direct upload limit; larger files take an upload URL.
            url="https://www.virustotal.com/api/v3/files"
            if [ "$(wc -c < "$f")" -gt 32000000 ]; then
              url="$(curl -fsS --retry 3 -H "@$hdr" \
                https://www.virustotal.com/api/v3/files/upload_url | jq -r .data)"
              sleep 16
            fi
            # The key and the archive only ever travel over HTTPS.
            case "$url" in
              https://*) ;;
              *) echo "::error::VirusTotal returned a non-HTTPS upload URL; $f not submitted"; exit 1 ;;
            esac
            curl -fsS --retry 3 -H "@$hdr" -F "file=@$f" "$url" > /dev/null
            sha="$(shasum -a 256 "$f" | cut -d' ' -f1)"
            # shellcheck disable=SC2016 # the backticks are Markdown, not a command
            printf -- '- [`%s`](https://www.virustotal.com/gui/file/%s)\n' "$f" "$sha" >> links.md
            echo "submitted $f ($sha)"
            sleep 16
          done
          cat notes.md links.md > notes-with-scan.md
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file notes-with-scan.md
          cat links.md
