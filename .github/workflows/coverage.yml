# SPDX-License-Identifier: MIT

# Coverage: runs the workspace test suite under cargo-llvm-cov (source-based
# LLVM coverage) and writes the line and region totals, then one row per
# crate, to the job summary. The OpenSSF Best Practices silver criterion
# test_statement_coverage80 asks for at least 80% statement coverage measured
# by a FLOSS tool; this job is the measurement (task #732).
#
# The job fails when line coverage drops under 90%, the gold criterion
# test_statement_coverage90 (the first run, 37219909593, measured 91.97% of
# lines and 91.01% of regions; main at fa804690, run 37225278581, the same),
# and when a test is red. The summary is written first either way.
#
# The `branches` job measures branch coverage for the gold criterion
# test_branch_coverage80. rustc instruments branches only on nightly
# (`-Zcoverage-options=branch`, which `cargo llvm-cov --branch` passes), so
# it runs the same suite on a dated nightly, apart from the stable job.
#
# The suite is the one CI's Test job runs (nextest `ci` profile, the
# `readify` feature), so the number covers what CI tests. The CLI tests spawn
# the built `pixel` binary; cargo-llvm-cov instruments it too and merges the
# profiles every process writes. Doctests are left out: their coverage needs
# a nightly toolchain.
name: Coverage

on:
  schedule:
    - cron: "47 2 * * *"

concurrency:
  group: ${{ github.workflow }}-main
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Nightly coverage selection
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.select.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check the latest successful nightly
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          python3 scripts/coverage-nightly.py --repository "$GITHUB_REPOSITORY" \
            --head "$GITHUB_SHA" --github-output "$GITHUB_OUTPUT"

  coverage:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: Coverage (cargo-llvm-cov)
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: llvm-tools-preview

      # Its own key: instrumented objects are useless to the Test job's
      # `linux-debug` cache and the other way round. Only main writes it.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: linux-coverage
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Install system dependencies
        # Vendored OpenSSL needs perl and make (see ci.yml).
        run: |
          if command -v perl >/dev/null && command -v make >/dev/null; then
            echo "perl and make already installed"
          else
            sudo apt-get update
            sudo apt-get install -y perl make
          fi

      - name: Install cargo-llvm-cov and cargo-nextest
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2
        with:
          tool: cargo-llvm-cov,cargo-nextest

      # A red test still yields a report: the status is kept and returned by
      # the last step, after the summary is written.
      - name: Test under coverage
        id: test
        run: |
          status=0
          cargo llvm-cov nextest --workspace --locked --profile ci \
            --features pixel-cli/readify --no-report || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Coverage report
        if: ${{ !cancelled() }}
        run: |
          cargo llvm-cov report --summary-only | tee target/coverage.txt
          cargo llvm-cov report --json --summary-only --output-path target/coverage.json
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json
          from collections import defaultdict

          data = json.load(open("target/coverage.json"))["data"][0]
          kinds = ("lines", "regions", "functions")

          def pct(c, n):
              return f"{100 * c / n:.2f}%" if n else "n/a"

          total = data["totals"]
          print("## Coverage (cargo-llvm-cov)\n")
          print("| | covered | total | % |\n| --- | ---: | ---: | ---: |")
          for k in kinds:
              print(f"| {k} | {total[k]['covered']} | {total[k]['count']} | {pct(total[k]['covered'], total[k]['count'])} |")

          crates = defaultdict(lambda: {k: [0, 0] for k in kinds})
          for f in data["files"]:
              parts = f["filename"].split("/crates/", 1)
              name = parts[1].split("/", 1)[0] if len(parts) == 2 else "(other)"
              for k in kinds:
                  crates[name][k][0] += f["summary"][k]["covered"]
                  crates[name][k][1] += f["summary"][k]["count"]
          print("\n### Per crate, lowest line coverage first\n")
          print("| crate | lines | regions | functions |\n| --- | ---: | ---: | ---: |")
          for name, s in sorted(crates.items(), key=lambda kv: kv[1]["lines"][0] / max(kv[1]["lines"][1], 1)):
              cells = " | ".join(f"{pct(*s[k])} ({s[k][1]})" for k in kinds)
              print(f"| {name} | {cells} |")
          EOF

      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-summary
          path: |
            target/coverage.txt
            target/coverage.json
          if-no-files-found: ignore

      - name: Tests passed
        env:
          TEST_STATUS: ${{ steps.test.outputs.status }}
        run: test "$TEST_STATUS" = 0

      # test_statement_coverage90 (gold; silver asks 80): llvm-cov's lines
      # are the closest measure of statements it reports.
      - name: Line coverage at least 90%
        run: cargo llvm-cov report --summary-only --fail-under-lines 90 > /dev/null

  branches:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: Branch coverage (cargo-llvm-cov, nightly)
    runs-on: ubuntu-26.04
    timeout-minutes: 75
    env:
      # A dated nightly, so a toolchain release cannot move the number on
      # its own; bump it on purpose.
      NIGHTLY: nightly-2026-10-01
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          # The pin is the action's commit used everywhere else; the ref
          # does not name the toolchain, so it is passed explicitly.
          toolchain: ${{ env.NIGHTLY }}
          components: llvm-tools-preview

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: linux-coverage-branch
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Install system dependencies
        run: |
          if command -v perl >/dev/null && command -v make >/dev/null; then
            echo "perl and make already installed"
          else
            sudo apt-get update
            sudo apt-get install -y perl make
          fi

      - name: Install cargo-llvm-cov and cargo-nextest
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2
        with:
          tool: cargo-llvm-cov,cargo-nextest

      - name: Test under branch coverage
        id: test
        run: |
          status=0
          cargo +"$NIGHTLY" llvm-cov nextest --branch --workspace --locked --profile ci \
            --features pixel-cli/readify --no-report || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Branch coverage report
        if: ${{ !cancelled() }}
        run: |
          cargo +"$NIGHTLY" llvm-cov report --branch --json --summary-only \
            --output-path target/coverage-branch.json
          # Per-line branch records (BRDA) for picking test targets:
          # scripts/coverage-uncovered-branches.py reads this file.
          cargo +"$NIGHTLY" llvm-cov report --branch --lcov \
            --output-path target/coverage-branch.lcov
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json
          from collections import defaultdict

          data = json.load(open("target/coverage-branch.json"))["data"][0]
          kinds = ("branches", "lines")

          def pct(c, n):
              return f"{100 * c / n:.2f}%" if n else "n/a"

          total = data["totals"]
          print("## Branch coverage (cargo-llvm-cov --branch, nightly)\n")
          print("| | covered | total | % |\n| --- | ---: | ---: | ---: |")
          for k in kinds:
              print(f"| {k} | {total[k]['covered']} | {total[k]['count']} | {pct(total[k]['covered'], total[k]['count'])} |")

          crates = defaultdict(lambda: {k: [0, 0] for k in kinds})
          for f in data["files"]:
              parts = f["filename"].split("/crates/", 1)
              name = parts[1].split("/", 1)[0] if len(parts) == 2 else "(other)"
              for k in kinds:
                  crates[name][k][0] += f["summary"][k]["covered"]
                  crates[name][k][1] += f["summary"][k]["count"]
          print("\n### Per crate, lowest branch coverage first\n")
          print("| crate | branches | lines |\n| --- | ---: | ---: |")
          for name, s in sorted(crates.items(), key=lambda kv: kv[1]["branches"][0] / max(kv[1]["branches"][1], 1)):
              cells = " | ".join(f"{pct(*s[k])} ({s[k][1]})" for k in kinds)
              print(f"| {name} | {cells} |")
          EOF

      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-branch-summary
          path: target/coverage-branch.json
          if-no-files-found: ignore

      - name: Upload the per-line branch report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-branch-lcov
          path: target/coverage-branch.lcov
          if-no-files-found: ignore

      - name: Tests passed
        env:
          TEST_STATUS: ${{ steps.test.outputs.status }}
        run: test "$TEST_STATUS" = 0
