# The homebrew-core formula, checked the way homebrew-core's CI would check a
# pull request that adds it: built from source (a `git archive` of the tree
# under test, so no tag is needed), `brew test`, `brew audit --strict --new`
# and `brew style`, on macOS and Linux. The formula comes from
# scripts/homebrew-core-formula.py, which release.yml runs on every tag and
# whose text scripts/test-homebrew-core-formula.py pins in CI.
#
# Not checked here: `brew audit --online` (the GitHub notability thresholds of
# a new formula, which no change to this repository can meet) and
# homebrew-core's own bottle build.
name: Homebrew core

on:
  pull_request:
    paths:
      - ".github/workflows/homebrew-core.yml"
      - "scripts/homebrew-core-formula.py"
      - "scripts/fixtures/homebrew/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/*/Cargo.toml"
      - "crates/pixel/build.rs"
  # Weekly: a dependency or a Homebrew change can break the source build
  # without any pull request touching the paths above.
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homebrew-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Release-prepare pull request? See release-prepare-scope.yml. Its version
  # bump names a tag that only exists after the merge, so `brew audit --new`
  # finds the formula's source URL unreachable (404) on every release; the
  # weekly run and the next pull request touching these paths check the
  # released version instead.
  scope:
    uses: ./.github/workflows/release-prepare-scope.yml

  build-from-source:
    name: brew install --build-from-source (${{ matrix.os }})
    needs: scope
    if: needs.scope.outputs.release-prepare != 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-26.04]
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_ANALYTICS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: Homebrew/actions/setup-homebrew@e99025eb970cfa124b8284a35463d87426917478 # main
        with:
          stable: true

      # The version Homebrew reads from the archive name must be the one
      # `pixel --version` prints, or the formula's test fails.
      - name: Write the formula from a source archive of this tree
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/pixel/Cargo.toml | head -1)
          src="$RUNNER_TEMP/pixel-$version.tar.gz"
          git archive --format=tar.gz --prefix="pixel-$version/" -o "$src" HEAD
          python3 scripts/homebrew-core-formula.py "v$version" "$src" "$RUNNER_TEMP/published.rb"
          PIXEL_SOURCE_URL="file://$src" \
            python3 scripts/homebrew-core-formula.py "v$version" "$src" "$RUNNER_TEMP/local.rb"
          brew tap-new --no-git local/core
          echo "FORMULA=$(brew --repository)/Library/Taps/local/homebrew-core/Formula/pixel.rb" >> "$GITHUB_ENV"

      # On the formula as a homebrew-core pull request would carry it: the
      # tag's archive URL.
      - name: brew style and brew audit --strict --new
        run: |
          cp "$RUNNER_TEMP/published.rb" "$FORMULA"
          brew style local/core/pixel
          brew audit --strict --new local/core/pixel

      - name: brew install --build-from-source
        run: |
          cp "$RUNNER_TEMP/local.rb" "$FORMULA"
          brew install --build-from-source --verbose local/core/pixel

      - name: brew test and linkage
        run: |
          brew test --verbose local/core/pixel
          brew linkage --test local/core/pixel
          if pgrep -fl "pixel daemon"; then
            echo "::error::brew test left a pixel daemon running"
            exit 1
          fi
