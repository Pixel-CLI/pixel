name: Index reference repositories
on:
  pull_request:
    paths:
      - '.github/workflows/mvp-reference.yml'
      - 'crates/mvp-index/**'
      - 'crates/mvp-model/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  push:
    branches: [main]
    paths:
      - '.github/workflows/mvp-reference.yml'
      - 'crates/mvp-index/**'
      - 'crates/mvp-model/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: index-reference-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  reference:
    name: Index truth (${{ matrix.repository }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - repository: basecamp/once-campfire
          - repository: Pixel-CLI/pixel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Read the pinned Campfire reference
        if: matrix.repository == 'basecamp/once-campfire'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: basecamp/once-campfire
          ref: edbc779f4dfc9b26c36310881711ddc976a9dfc8
          path: reference
          persist-credentials: false
      - name: Read the pinned Pixel reference
        if: matrix.repository == 'Pixel-CLI/pixel'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Pixel-CLI/pixel
          ref: 85bede7d9a3c4e385e0a2045241a6466efbd8cbd
          path: reference
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Every extracted row is true of the pinned tree
        env:
          PIXEL_MVP_REFERENCE_REPO: ${{ github.workspace }}/reference
        run: cargo test --locked -p mvp-index truth::c10_reference_every_row_is_true_of_the_tree -- --ignored --exact
