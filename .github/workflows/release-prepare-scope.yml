name: Release-prepare scope

# Decides whether this run is a release-prepare pull request into main,
# whose jobs are skipped: a `release-` head branch AND a diff that
# scripts/release-prepare-only.py accepts (version lines, CHANGELOG.md,
# deleted fragments). The branch name alone would let any code change
# skip the gates. Any other event, or a failed check, keeps every job.
#
# Called by ci.yml, mutants.yml, cross-build.yml and homebrew-core.yml as
# their `scope` job: one definition, so the workflows cannot disagree on what
# a release-prepare pull request is.
on:
  workflow_call:
    outputs:
      release-prepare:
        description: "'true' when the calling run's jobs may be skipped"
        value: ${{ jobs.check.outputs.release-prepare }}

permissions:
  contents: read

jobs:
  check:
    name: Release-prepare scope
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      release-prepare: ${{ steps.check.outputs.release-prepare }}
    steps:
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1
        if: github.event_name == 'pull_request' && github.base_ref == 'main' && startsWith(github.head_ref, 'release-')
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: check
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          verdict=false
          if [ "$EVENT" = pull_request ] && [ "$BASE_REF" = main ] && [[ "$HEAD_REF" == release-* ]] \
            && python3 scripts/release-prepare-only.py "$BASE_SHA" "$HEAD_SHA"; then
            verdict=true
          fi
          echo "release-prepare=$verdict" | tee -a "$GITHUB_OUTPUT"
