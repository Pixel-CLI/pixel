# Weekly perf tripwire, beside the nightly mutants campaign: build the pinned
# public corpus from nothing, then again after one file changed, and compare
# each `prepare-repo --json` receipt with `.github/perf-baseline.json` at 3x
# (a tripwire, not a benchmark; see `docs/bench/cold-index.md` for the
# calibrated study). `scripts/ci/check-perf.py` also refuses a receipt that
# looks fast because it measured nothing — a reused index on the cold run, or
# no symbols — and writes the numbers to the job summary. Both receipts ride
# the run as an artifact. A second job scores the brief on the 56 public
# questions (`eval/brief-bench/`) through the prompt-submit hook route and
# judges its p95/max `elapsed_ms` and its `partial` count (#1083, item 3 of
# #1086): a regression in the brief's window lands here, not in a user's chat.
# A third job times `tree_delta`, the whole-tree freshness check the daemon
# runs on reopen, on the same corpus and a generated tree, against a p50
# ceiling.
name: Perf

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-main
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CORPUS: excalidraw/excalidraw
  CORPUS_SHA: 541653c7c9d587d463a47daacff9fb30e45a52e7

jobs:
  cold-graph:
    name: Cold + incremental prepare-repo
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: linux-perf
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      # `dev-release` is the shipped optimisation without thin LTO: the
      # measurement exercise is the index and graph, not the linker.
      - name: Build the pixel under test
        run: cargo build --profile dev-release --locked -p pixel-cli

      - name: Check the checker
        run: python3 -I scripts/ci/check-perf.py --self-test

      # A shallow fetch of the one pinned commit: the lane measures the
      # tree, not its history, and `--depth 1` keeps the job short.
      - name: Clone the pinned corpus
        run: |
          git init -q "$RUNNER_TEMP/corpus"
          git -C "$RUNNER_TEMP/corpus" remote add origin "https://github.com/$CORPUS.git"
          git -C "$RUNNER_TEMP/corpus" fetch -q --depth 1 origin "$CORPUS_SHA"
          git -C "$RUNNER_TEMP/corpus" checkout -q FETCH_HEAD

      - name: Cold prepare-repo
        run: |
          rm -rf "$RUNNER_TEMP/perf-cache"
          XDG_CACHE_HOME="$RUNNER_TEMP/perf-cache" \
            target/dev-release/pixel prepare-repo --no-daemon --metrics off --json \
            "$RUNNER_TEMP/corpus" > "$RUNNER_TEMP/cold.json"

      - name: Cold ceilings
        run: |
          python3 -I scripts/ci/check-perf.py --label cold \
            --timings "$RUNNER_TEMP/cold.json" --summary "$GITHUB_STEP_SUMMARY"

      - name: One-file incremental update
        run: |
          file=$(git -C "$RUNNER_TEMP/corpus" ls-files '*.ts' | head -1)
          echo "// perf $GITHUB_RUN_ID" >> "$RUNNER_TEMP/corpus/$file"
          XDG_CACHE_HOME="$RUNNER_TEMP/perf-cache" \
            target/dev-release/pixel prepare-repo --no-daemon --metrics off --json \
            "$RUNNER_TEMP/corpus" > "$RUNNER_TEMP/incremental.json"

      - name: Incremental ceilings
        run: |
          python3 -I scripts/ci/check-perf.py --label incremental \
            --timings "$RUNNER_TEMP/incremental.json" --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: perf-receipts
          path: |
            ${{ runner.temp }}/cold.json
            ${{ runner.temp }}/incremental.json
          if-no-files-found: warn

  # The brief's own timing on the public acceptance set: `score_brief.py`
  # clones the seven pinned repositories, indexes each once, builds every
  # brief as the prompt-submit hook does (3 s window, probe floor) and writes
  # `report.json`; `check-perf.py --label brief` judges it against
  # `.github/perf-baseline.json`. The probes come from this commit, frozen in
  # their own home (a fresh runner has none installed), and the embedding
  # model is pinned into that home, so the measured binary, probes, model
  # and questions are all named by the run.
  brief-latency:
    name: Brief latency (56 public questions)
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1
        with:
          persist-credentials: false

      # `runner.temp` is not available to a job-level `env:`.
      - name: Name the probe home
        run: echo "PROBE_HOME=$RUNNER_TEMP/probe-home" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: linux-perf
          save-if: false
          cache-on-failure: true

      - name: Build the pixel under test
        run: cargo build --profile dev-release --locked -p pixel-cli

      - name: Check the checker
        run: python3 -I scripts/ci/check-perf.py --self-test

      # `freeze-home` writes this commit's bundled probes and their hashes;
      # the scorer refuses a home whose files no longer match them.
      - name: Freeze this commit's probes
        run: python3 -I scripts/bench/tool-census/score_brief.py freeze-home --commit HEAD --out "$PROBE_HOME"

      - name: Cache key of the pinned embedding model
        id: model
        run: echo "key=$(bash scripts/ci/fetch-embedding-model.sh --cache-key)-probe-home" >> "$GITHUB_OUTPUT"
      - name: Restore the pinned embedding model
        id: model-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.PROBE_HOME }}/.cache/huggingface/hub/models--minishlab--potion-code-16M-v2
            ${{ env.PROBE_HOME }}/.local/share/pixel/models/potion-minishlab--potion-code-16M-v2.ok
          key: ${{ steps.model.outputs.key }}
      - name: Pin the embedding model in the probe home
        run: bash scripts/ci/fetch-embedding-model.sh "$PROBE_HOME"
      - name: Save the pinned embedding model
        if: steps.model-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.PROBE_HOME }}/.cache/huggingface/hub/models--minishlab--potion-code-16M-v2
            ${{ env.PROBE_HOME }}/.local/share/pixel/models/potion-minishlab--potion-code-16M-v2.ok
          key: ${{ steps.model.outputs.key }}

      # The scorer exits 1 on any `partial` brief; the next step judges the
      # report against the ceilings instead, so its exit is recorded, not fatal.
      # `--bin` is absolute: the scorer runs it from inside each clone, and a
      # relative path made all 56 questions `process_error` (run 39190747992).
      - name: Score the brief on the public questions
        run: |
          python3 -I scripts/bench/tool-census/score_brief.py \
            --bin "$GITHUB_WORKSPACE/target/dev-release/pixel" --probe-home "$PROBE_HOME" \
            --root "$RUNNER_TEMP/brief-bench" --out "$RUNNER_TEMP/brief-runs" --label brief \
            || echo "::notice::score_brief.py exited $? (judged by the next step)"

      - name: Brief ceilings
        run: |
          python3 -I scripts/ci/check-perf.py --label brief \
            --timings "$RUNNER_TEMP/brief-runs/brief/report.json" --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload the brief report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: brief-latency-report
          path: |
            ${{ runner.temp }}/brief-runs/brief/report.json
            ${{ runner.temp }}/brief-runs/brief/report.md
          if-no-files-found: warn

  # `tree_delta` is what the daemon runs when it reopens a graph, and what
  # every `evaluate` answer pays twice; `docs/bench/tree-delta.md` measured
  # a 50 000-file tree between 1.3 s idle and 7 s loaded with no gate either
  # way. The bench builds a graph, then times 25 warm `tree_delta` calls on
  # the pinned corpus and on a generated tree of 10 000 files (the reduced
  # variant: the 50 000-file build alone takes about 40 s), and writes the
  # numbers as JSON for `check-perf.py --label tree_delta`.
  tree-delta:
    name: tree_delta freshness walk
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: linux-perf-bench
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Check the checker
        run: python3 -I scripts/ci/check-perf.py --self-test

      - name: Clone the pinned corpus
        run: |
          git init -q "$RUNNER_TEMP/corpus"
          git -C "$RUNNER_TEMP/corpus" remote add origin "https://github.com/$CORPUS.git"
          git -C "$RUNNER_TEMP/corpus" fetch -q --depth 1 origin "$CORPUS_SHA"
          git -C "$RUNNER_TEMP/corpus" checkout -q FETCH_HEAD

      # `dev-release`, like the other jobs: the shipped optimisation without
      # thin LTO, so the bench measures the walk, not a slower link.
      - name: Time tree_delta
        env:
          PIXEL_BENCH_TREE_ROOT: ${{ runner.temp }}/corpus
          PIXEL_BENCH_SYNTH_FILES: "10000"
          PIXEL_BENCH_ITERS: "25"
          PIXEL_BENCH_JSON: ${{ runner.temp }}/tree-delta.json
        run: cargo bench --profile dev-release --locked -p pixel-bench --bench tree_delta

      - name: tree_delta ceilings
        run: |
          python3 -I scripts/ci/check-perf.py --label tree_delta \
            --timings "$RUNNER_TEMP/tree-delta.json" --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload the receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tree-delta-receipt
          path: ${{ runner.temp }}/tree-delta.json
          if-no-files-found: warn
