name: Cancel stale runs

# A merged (or closed) pull request cannot benefit from the validations
# still queued or running for its head: the branch is gone, so the verdict
# would apply to a commit nobody will ever look at. Cancel those runs so
# the runner queue (a self-hosted runner drains one job at a time) never serves work whose
# answer is moot. `concurrency` in the heavy workflows already covers the
# same-branch repush; this covers the merge/close that fires no new job to
# supersede the old ones. Manual purge from a checkout:
#   bash scripts/cancel-stale-runs.sh --all --older-than 60 --apply
on:
  pull_request:
    types: [closed]
  # The close event is a point-in-time snapshot: a post-close push to a
  # deleted branch (or a superseded queue entry) fires no new event. A
  # periodic sweep catches those, so the runner queue never grows on runs
  # whose PR is already closed.
  schedule:
    - cron: '*/10 * * * *'

# Read-only at the top: the write scope belongs to the one job that cancels
# runs, so a job added later does not inherit it (OpenSSF Scorecard
# Token-Permissions).
permissions:
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-26.04
    permissions:
      # actions/checkout of main.
      contents: read
      # List runs and POST /actions/runs/{id}/cancel.
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
      - name: Cancel this PR's queued and in-progress runs
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: bash scripts/cancel-stale-runs.sh --branch "$PR_HEAD" --apply
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
      - name: Cancel runs whose PR is already closed
        if: github.event_name == 'schedule'
        run: bash scripts/cancel-stale-runs.sh --closed --apply
        env:
          GH_TOKEN: ${{ github.token }}