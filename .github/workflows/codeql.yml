# CodeQL: static analysis (SAST) of the code and the workflows, on every pull
# request into `main`, every push to `main` and nightly, so a new query pack
# also reaches code nobody touched. Results land in the Security tab as
# code-scanning alerts, and on a pull request as the `CodeQL` check.
#
# OpenSSF Scorecard's SAST check reads both halves: a workflow that uses
# `github/codeql-action/analyze`, and the code-scanning check run on each
# recently merged pull request. Actions/Python/JavaScript scan every PR;
# Rust runs after merge, nightly and on manual dispatch (select a branch
# to scan it before merge). No top-level path filter or source exclusion.
#
# Every language runs with `build-mode: none`. It is the only mode CodeQL
# supports for Rust: rust-analyzer runs the build scripts and expands the
# macros without a full `cargo build`. A dedicated Cargo cache reuses this
# work; it is separate from the test/lint caches and only main can save it.
# `dependency-caching` in codeql-action does not support Rust. Python and
# JavaScript/TypeScript (the plugins `pixel-install` ships, `docs/motion`)
# and the workflows themselves (`actions`) need no build either.
name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      # Upload the results to code scanning.
      security-events: write
      contents: read
      actions: read # CodeQL reads workflow-run metadata.
    strategy:
      fail-fast: false
      matrix:
        # Keep Rust off the PR critical path, including Rust-changing PRs.
        language: ${{ fromJSON(github.event_name == 'pull_request' && '["actions","python","javascript-typescript"]' || '["rust","actions","python","javascript-typescript"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Identify Rust extraction cache
        if: matrix.language == 'rust'
        id: rust-toolchain
        run: |
          echo "CODEQL_EXTRACTOR_RUST_OPTION_CARGO_TARGET_DIR=$RUNNER_TEMP/codeql-rust-target" >> "$GITHUB_ENV"
          rustc --version --verbose
          echo "hash=$(rustc --version --verbose | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Restore Rust extraction cache
        if: matrix.language == 'rust'
        id: rust-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/codeql-rust-target
          key: codeql-rust-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-toolchain.outputs.hash }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', '.cargo/config.toml', '.github/workflows/codeql.yml') }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          # Default security queries preserve eligibility for incremental analysis.

      - name: Analyze and upload results
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}

      # A manual branch scan may restore main's cache, but never publishes build
      # scripts/proc macros for a later trusted run. Save only after analysis
      # succeeds; the cache is an optimization, never a substitute for a scan.
      - name: Save Rust extraction cache from main
        if: matrix.language == 'rust' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/codeql-rust-target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
