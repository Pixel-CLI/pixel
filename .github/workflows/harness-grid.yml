name: harness-grid

# Generate the four harness videos (Claude Code, Codex, pi, Antigravity)
# with scripts/harness-sandbox-shoot.sh and publish the 2x2 grid to a pull
# request. The sandbox today is the OrbStack VM `pixel`, whose CLIs carry
# the logins and whose recording tools the pipeline installs itself — so
# the job targets the runner where those live: your machine, registered as
# a self-hosted GitHub Actions runner. On a GitHub-hosted runner it would
# refuse (no OrbStack) and fail loudly rather than half-run.
#
#   gh workflow run harness-grid -f pr=415
#   # optional: prompt="Create the \"story\" feature" (default)

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to publish the grid on
        required: true
      prompt:
        description: The natural prompt every harness runs (no tool hints)
        required: false
        default: 'Create the "story" feature'

# Read-only at the top: the write scopes belong to the one job that uses
# them, so a job added later does not inherit them (OpenSSF Scorecard
# Token-Permissions).
permissions:
  contents: read

jobs:
  grid:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    permissions:
      # git push of the recordings to the harness-recordings-media branch.
      contents: write
      # gh pr view / gh pr edit of the PR body that carries the grid.
      pull-requests: write
    steps:
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1
        with:
          fetch-depth: 0
      - name: Shoot the four harnesses and publish the grid
        env:
          HARNESS_INTERACTIVE_MAX: "300"
          PR: ${{ inputs.pr }}
          PROMPT: ${{ inputs.prompt }}
        run: |
          scripts/harness-sandbox-shoot.sh "$PR" "$PROMPT"
      - name: Post the run summary
        if: always()
        run: |
          echo "## Sandbox grid run" >> "$GITHUB_STEP_SUMMARY"
          for p in claude codex pi agy; do
            meta="scripts/shoot4/meta-$p-rns.json"
            [ -s "$meta" ] || continue
            python3 - "$p" "$meta" >> "$GITHUB_STEP_SUMMARY" << 'PY'
          import json
          import sys

          provider, path = sys.argv[1], sys.argv[2]
          m = json.load(open(path))
          print(f"- **{provider}**: {m['pixel_calls']} pixel calls in {round(m['wall_ms'] / 1000)}s")
          PY
          done
