# OpenSSF Scorecard: scores the repository's supply-chain practices (pinned
# actions, token permissions, branch protection, signed releases, ...) and
# publishes the result to api.scorecard.dev, which serves the README badge.
# The findings also land in the Security tab as code-scanning alerts.
#
# Publishing constrains this file: the scorecard API rejects a result unless
# the job runs on a GitHub-hosted runner, without top-level env or defaults,
# and only uses actions/checkout, actions/upload-artifact,
# github/codeql-action/upload-sarif and ossf/scorecard-action.
name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  branch_protection_rule:
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Upload the SARIF file to code scanning.
      security-events: write
      # Sign the published result (OIDC token for Sigstore).
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif
