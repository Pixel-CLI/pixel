# OpenSSF Scorecard: scores the repository's supply-chain practices (pinned
# actions, token permissions, branch protection, signed releases, ...) and
# publishes the result to api.scorecard.dev, which serves the README badge.
# The findings also land in the Security tab as code-scanning alerts.
#
# Publishing constrains this file: the scorecard API rejects a result unless
# the job runs on a GitHub-hosted runner, without top-level env or defaults,
# and only uses actions/checkout, actions/upload-artifact,
# github/codeql-action/upload-sarif and ossf/scorecard-action.
name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  branch_protection_rule:
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: blacksmith-8vcpu-ubuntu-2404
    permissions:
      # Upload the SARIF file to code scanning.
      security-events: write
      # Sign the published result (OIDC token for Sigstore).
      id-token: write
    steps:
      - uses: useblacksmith/checkout@v1 # v7
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
