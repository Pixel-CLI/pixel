name: Release build

# Builds, packages and signs everything a release publishes, called by
# release.yml once its `verify` job has passed on the tag. It lives in its own
# reusable workflow for SLSA Build Level 3: the attestation's signer is this
# file, not the caller, so the caller's steps (the tap token, the publication)
# cannot reach the signing identity, and `gh attestation verify
# --signer-workflow Pixel-CLI/pixel/.github/workflows/release-build.yml`
# accepts only what this file built. It holds no secret.
#
# The github context is the caller's: GITHUB_REF is the release tag here too.
on:
  workflow_call:

permissions:
  contents: read

# Same value as ci.yml, cross-build.yml and release.yml: rust-cache hashes
# every CARGO_* variable into its key, and a called workflow does not inherit
# the caller's env, so a missing value here would miss their caches.
env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        # features: the cargo feature flags of the target's build, read by
        # the build and by the SBOM, which must describe that exact feature
        # set. fastembed (ONNX) has no musl build; model2vec is pure Rust and
        # does, so the Linux binaries keep a working semantic channel.
        # cross-build.yml spells the same flags in its build commands.
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-26.04
            features: --no-default-features --features model2vec
          - target: aarch64-unknown-linux-musl
            os: ubuntu-26.04
            features: --no-default-features --features model2vec
          - target: aarch64-apple-darwin
            os: macos-latest
            features: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The job never pushes: do not leave the token in .git/config.
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          # The SHA pin no longer names the toolchain through the ref, so
          # it is passed explicitly (same channel as before).
          toolchain: stable
          targets: ${{ matrix.target }}

      # The reproducible-build environment (SECURITY.md, "Reproducing a
      # release build"): SOURCE_DATE_EPOCH from the tagged commit, the
      # checkout and CARGO_HOME remapped out of the binary through RUSTFLAGS.
      # Before the cache step: rust-cache hashes RUSTFLAGS into its key, and
      # cross-build.yml sets the same value for the entry restored below.
      # reproducible-build.yml builds the x86_64 lane twice with it.
      - name: Reproducible build environment
        run: scripts/release-build-env.sh --github-env

      # Restores what cross-build.yml saved on main for this target (shared
      # key release-<target>): the dependencies arrive compiled, and only the
      # workspace crates and the thin-LTO link are left. Never saves: a tag's
      # cache is unreadable by the next tag.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: release-${{ matrix.target }}
          save-if: false

      # Prebuilt binary instead of `cargo install cross`. cross compiles inside
      # its own Docker image (musl toolchain included), so no host packages.
      # Pinned: the image is part of what a reproduced build must match, and
      # cross-build.yml and reproducible-build.yml pin the same version.
      - name: Install cross (Linux musl)
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2
        with:
          tool: cross@0.2.5

      - name: Build (Linux musl via cross, model2vec only)
        if: runner.os == 'Linux'
        run: cross build --release --locked ${{ matrix.features }} --target ${{ matrix.target }} -p pixel-cli

      - name: Build (macOS native)
        if: runner.os == 'macOS'
        run: cargo build --release --locked ${{ matrix.features }} --target ${{ matrix.target }} -p pixel-cli

      - name: Package
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          TARGET="${{ matrix.target }}"
          ARCHIVE="pixel-${VERSION}-${TARGET}.tar.gz"
          STAGING="pixel-${VERSION}-${TARGET}"
          mkdir -p "$STAGING/bin"
          cp "target/${TARGET}/release/pixel" "$STAGING/bin/"
          cp README.md LICENSE "$STAGING/"
          tar czf "$ARCHIVE" "$STAGING"
          shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"

      # The SBOM published beside the archive (OSPS-QA-02.02):
      # pixel-<tag>-<target>.cdx.json, CycloneDX 1.5 JSON. cargo-cyclonedx
      # reads `cargo metadata`, which resolves features across the whole
      # workspace and over-includes optional dependencies (68 crates on the
      # 0.6.1 Linux build, the ort and OpenSSL stack among them); `cargo tree
      # -p` resolves them as the build does, and release-sbom.py keeps only
      # the crates it lists, failing when one the build compiles is absent.
      # Its name matches none of the pixel-*.tar.gz globs downstream.
      - name: Install cargo-cyclonedx
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2
        with:
          tool: cargo-cyclonedx@0.5.9

      - name: SBOM
        env:
          TARGET: ${{ matrix.target }}
          FEATURES: ${{ matrix.features }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # shellcheck disable=SC2086 # FEATURES is a list of cargo flags
          cargo cyclonedx --manifest-path crates/pixel/Cargo.toml --describe binaries \
            --format json --spec-version 1.5 --target "$TARGET" $FEATURES
          # shellcheck disable=SC2086
          cargo tree --locked -p pixel-cli --target "$TARGET" $FEATURES \
            -e normal,build --prefix none --format '{p}' > "$RUNNER_TEMP/sbom-tree.txt"
          python3 scripts/release-sbom.py crates/pixel/pixel_bin.cdx.json \
            "$RUNNER_TEMP/sbom-tree.txt" "$TAG" "$TARGET" "pixel-${TAG}-${TARGET}.cdx.json"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pixel-${{ matrix.target }}
          path: |
            pixel-*.tar.gz
            pixel-*.tar.gz.sha256
            pixel-*.cdx.json

  attest:
    name: Package and attest
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      # Provenance attestation: the OIDC token Sigstore exchanges for a
      # short-lived signing certificate naming this workflow, and the write
      # that stores the signed attestation on the repository.
      id-token: write
      attestations: write
    steps:
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1
        with:
          # The job never pushes: do not leave the token in .git/config.
          persist-credentials: false

      - name: Download the archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: pixel-*
          path: artifacts
          merge-multiple: true

      # pixel.rb and the two Linux bottles: the musl binary laid out as a keg,
      # which Homebrew pours where a formula without a bottle would need a C
      # compiler. The script checks each archive against its .sha256 and is
      # held by scripts/test-homebrew-formula.py, which CI runs on every pull
      # request that touches it, so this step changes without a tag.
      - name: Generate the Homebrew formula and the Linux bottles
        run: python3 scripts/homebrew-formula.py "${GITHUB_REF#refs/tags/}" artifacts .

      # pixel-core.rb: the formula a homebrew-core pull request carries,
      # built from the source archive GitHub serves for this tag (its sha256
      # is only known once the tag exists). homebrew-core.yml builds and
      # audits the same formula from source on every change to it.
      - name: Generate the homebrew-core formula (build from source)
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          curl -fsSL --retry 3 -o source.tar.gz \
            "https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${TAG}.tar.gz"
          python3 scripts/homebrew-core-formula.py "$TAG" source.tar.gz pixel-core.rb

      # The SBOM glob below would sign an empty set without complaint: a
      # build job that uploaded its archive without its SBOM stops here.
      - name: Check every archive has its SBOM
        run: |
          for archive in artifacts/pixel-*.tar.gz; do
            if [ ! -s "${archive%.tar.gz}.cdx.json" ]; then
              echo "::error::no SBOM beside $archive; the release would ship it without one"
              exit 1
            fi
          done

      # SLSA build provenance for what a user downloads and runs: each
      # archive, each Linux bottle Homebrew pours, and install.sh, which the
      # README pipes into sh, plus each archive's SBOM, so the SBOM a user
      # reads is provably the one this workflow wrote for that tag. The
      # .sha256 files ship beside the archives in the same release, so they
      # prove the download was not corrupted, never who built it; an
      # attestation is signed by this workflow on this tag and checked with
      # `gh attestation verify` (SECURITY.md). Before the hand-off on
      # purpose: a signing failure stops the release instead of publishing
      # it unattested. release.yml's smoke job verifies the archive, its
      # SBOM and install.sh after publication.
      - name: Attest build provenance
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            artifacts/pixel-*.tar.gz
            artifacts/pixel-*.cdx.json
            pixel-*.bottle.tar.gz
            scripts/install.sh

      # Everything release.yml publishes, in one artifact: the attested
      # files themselves, not a rebuild or a second checkout of them.
      # The attestation also ships as a file: bundle-path is the Sigstore
      # bundle actions/attest wrote, one JSON line covering every subject,
      # which `gh attestation verify --bundle` checks without the
      # attestations API (SECURITY.md). It is named *.intoto.jsonl because
      # that suffix is what OpenSSF Scorecard's Signed-Releases check reads
      # as provenance on a release asset; it matches neither pixel-*.tar.gz
      # glob the publication, the smoke job and VirusTotal read.
      - name: Stage the release assets
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          mkdir release-assets
          cp artifacts/pixel-*.tar.gz artifacts/pixel-*.tar.gz.sha256 \
            artifacts/pixel-*.cdx.json \
            pixel-*.bottle.tar.gz pixel.rb pixel-core.rb scripts/install.sh \
            release-assets/
          if [ ! -s "$BUNDLE" ]; then
            echo "::error::actions/attest left no bundle at '$BUNDLE'; the release would ship without its provenance file"
            exit 1
          fi
          cp "$BUNDLE" "release-assets/pixel-${GITHUB_REF#refs/tags/}.intoto.jsonl"
          ls -l release-assets

      - name: Upload the release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-assets
          path: release-assets/
