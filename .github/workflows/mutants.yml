name: Mutants

# Mutation testing on the code a pull request touches. cargo-mutants rewrites
# each changed function (return a default, flip an operator, drop a match
# guard) and requires the crate's tests to fail. A mutant that survives means
# the change is not covered by a test that can fail, which is a gate in
# CONTRIBUTING.md ("Mutation testing"). Full-tree runs are a local,
# per-crate activity; CI only pays for the diff.
#
# Three jobs. `plan` lists the diff's mutants (no build) and sizes a matrix.
# Each `shard` job runs one consecutive slice of that list. `gate` totals the
# shards' outcomes against the listing and keeps the check name this workflow
# has always reported ("Mutants in diff"). Mutants used to run one after the
# other in a single job: 77 `pixel-cli` mutants took about 35 minutes, and a
# 658-mutant diff could not fit the 90-minute limit at all.
#
# `workflow_dispatch` runs the same three jobs on a past range instead of a
# pull request: `gh workflow run mutants.yml -f diff_range=e8a4d14...372e1c4`
# mutates the `crates/` part of that range in the tree of its right end, so
# the diff still matches the source even after `main` moved on. It is how a
# pull request merged without a verdict gets one afterwards (#222). The
# range's right end must be in the history of the branch the run is
# dispatched from (#674).
on:
  pull_request:
    paths:
      - ".cargo/mutants.toml"
      - ".github/workflows/mutants.yml"
      - "Cargo.*"
      - "crates/**"
      - "scripts/mutants-gate.py"
  workflow_dispatch:
    inputs:
      diff_range:
        description: "Three-dot range whose crates/ changes to mutate, e.g. e8a4d14...372e1c4"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Release-prepare pull request? See release-prepare-scope.yml.
  scope:
    uses: ./.github/workflows/release-prepare-scope.yml

  plan:
    name: Mutants plan
    # A release-prepare pull request into main mutates nothing it wrote
    # (version bumps, Cargo.lock, changelog): skipped once `scope` verified
    # the diff, as in ci.yml.
    needs: scope
    if: needs.scope.outputs.release-prepare != 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    outputs:
      mutants: ${{ steps.size.outputs.mutants }}
      shards: ${{ steps.size.outputs.shards }}
      # The commit the shards mutate: the range's right end on a dispatch,
      # empty on a pull request (the checkout's default, its merge commit).
      ref: ${{ steps.diff.outputs.ref }}
      # The skip guard's finding (#590): whether a green verdict already
      # exists for this exact tree (same UTC day), the run that recorded it,
      # and the tree the shards mutate -- the merge commit's on a pull
      # request, the range tip's on a dispatch. The gate saves a fresh
      # verdict under it.
      duplicate: ${{ steps.dup.outputs.duplicate }}
      verdict-run: ${{ steps.dup.outputs.verdict_run }}
      tree: ${{ steps.key.outputs.tree }}
      day: ${{ steps.key.outputs.day }}
    steps:
      # Full history so the merge base with the target branch is available.
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1
        with:
          # The job never pushes: do not leave the token in .git/config.
          persist-credentials: false
          fetch-depth: 0

      # `cargo mutants --list` reads the workspace through `cargo metadata`,
      # so it needs a toolchain but no build cache.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      # Pinned, and pinned to the same version as the shard jobs: `--shard
      # k/n` slices the list each job generates for itself, so the plan and
      # every shard must generate the same list. Two cargo-mutants releases
      # can disagree on which mutants a diff produces.
      - name: Install cargo-mutants
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2
        with:
          tool: cargo-mutants@27.1.0

      # Three-dot diff: what this branch changed since it left the target
      # branch, so mutants are generated only in code the PR authored. The
      # shards and the gate reuse this exact file through the artifact below
      # rather than recomputing it against a target branch that may have
      # moved since.
      #
      # On a dispatch the range is the input, restricted to `crates/`, and
      # its right end is checked out beside this tree: the listing must come
      # from the code the diff describes, while the gate script and config
      # stay this branch's.
      - name: Diff against the target branch
        id: diff
        env:
          BASE_REF: ${{ github.base_ref }}
          DIFF_RANGE: ${{ inputs.diff_range }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ]; then
            git diff "origin/$BASE_REF...HEAD" > pr.diff
            echo "src=." >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! [[ "$DIFF_RANGE" =~ ^[0-9a-f]{7,40}\.\.\.[0-9a-f]{7,40}$ ]]; then
            echo "::error title=Bad diff_range::expected <sha>...<sha>, got '$DIFF_RANGE'"
            exit 1
          fi
          tip=$(git rev-parse --verify "${DIFF_RANGE#*...}^{commit}")
          # The shards build and test the tip, inside this run's cache
          # scope: the dispatched branch's, so `main`'s when dispatched from
          # it. A tip outside that branch's history would run unmerged code
          # where it can write cache entries every later `main` run
          # restores (CodeQL actions/cache-poisoning, #674). The dispatch
          # exists for merged pull requests, already in that history.
          if ! git merge-base --is-ancestor "$tip" HEAD; then
            echo "::error title=Range outside this branch::$tip is not in the history of $GITHUB_REF_NAME; dispatch from a branch that contains it"
            exit 1
          fi
          git diff "$DIFF_RANGE" -- crates/ > pr.diff
          git worktree add --detach "$RUNNER_TEMP/tip" "$tip"
          echo "ref=$tip" >> "$GITHUB_OUTPUT"
          echo "src=$RUNNER_TEMP/tip" >> "$GITHUB_OUTPUT"

      # The skip-guard key (see ci.yml's changes job): the tree of the code
      # the shards mutate. A dispatch's shards mutate the range tip, not the
      # checkout, so the key comes from that worktree; a pull request's
      # shards mutate the merge commit.
      - name: Mutated tree and UTC day
        id: key
        env:
          SRC: ${{ steps.diff.outputs.src }}
        run: |
          echo "tree=$(git -C "$SRC" rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"
          echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      # A green gate recorded a marker under mutants-verdict-<tree>-<day>
      # (the gate below): a repush with no content change restores it and
      # skips the shards entirely -- every mutant the diff produces was
      # already judged by the run the marker points at. The listing still
      # runs, so the gate's artifact and outputs keep their shape. The
      # Actions cache makes the key a fact: an entry exists only if a green
      # gate of this exact tree wrote it, and an entry is immutable.
      - name: Restore a green verdict for this exact tree
        id: verdict
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/verdict
          key: mutants-verdict-${{ steps.key.outputs.tree }}-${{ steps.key.outputs.day }}

      - name: Skip when the tree already has a green verdict
        id: dup
        if: steps.verdict.outputs.cache-hit == 'true'
        run: |
          if [ ! -f "$RUNNER_TEMP/verdict/green" ]; then
            echo "the restored cache holds no marker; running"
            exit 0
          fi
          echo "duplicate=true" >> "$GITHUB_OUTPUT"
          echo "verdict_run=$(cat "$RUNNER_TEMP/verdict/green")" >> "$GITHUB_OUTPUT"
          echo "Mutants: this merge tree already has a green verdict (same UTC day); the shards will be skipped." >> "$GITHUB_STEP_SUMMARY"

      # `cargo mutants` exits 0 both when every mutant was caught and when it
      # produced none at all, and the run's own output cannot tell those
      # apart after the fact. `--list` builds nothing, so this costs seconds.
      # The configuration is this workflow's, copied beside the diff for the
      # shards: cargo-mutants reads `.cargo/mutants.toml` from the tree it
      # mutates, and a dispatch's tip may predate the arguments every lane
      # now takes from it (`--locked`, `--all-targets`). On a pull request
      # the two files are the same one.
      - name: List the mutants the diff produces
        env:
          SRC: ${{ steps.diff.outputs.src }}
        run: |
          cp .cargo/mutants.toml mutants-config.toml
          cargo mutants --list --dir "$SRC" --config "$PWD/mutants-config.toml" \
            --in-diff "$PWD/pr.diff" > mutants-list.txt

      # One shard per 10 mutants, at most 10 (the reasoning sits beside
      # MUTANTS_PER_SHARD and MAX_SHARDS in the script). No mutants means an
      # empty matrix and no shard job: each one would pay a baseline build
      # to test nothing.
      - name: Size the shard matrix
        id: size
        env:
          SRC: ${{ steps.diff.outputs.src }}
        run: >
          python3 scripts/mutants-gate.py --diff pr.diff --list mutants-list.txt
          --config mutants-config.toml --github-output "$GITHUB_OUTPUT"

      - name: Upload the diff and the listing
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mutants-plan
          path: |
            pr.diff
            mutants-list.txt
            mutants-config.toml
          # A re-run of the whole workflow uploads it again under the same
          # name; without this the second upload is refused.
          overwrite: true

  shard:
    # The matrix value is the literal `--shard` argument, so the job name is
    # also the local reproduction: `cargo mutants --in-diff pr.diff --shard
    # 2/5`. cargo-mutants numbers shards from 0.
    name: Mutants shard ${{ matrix.shard }}
    needs: plan
    if: needs.plan.outputs.mutants != '0' && needs.plan.outputs.duplicate != 'true'
    # Compiling happens here tens of mutants at a time, which is where a self-hosted
    # runner pays off most: PIXEL_RUNNER_LABELS (see ci.yml) moves the shards to it
    # for pushes, dispatches and pull requests from branches of this repository,
    # whose diff the maintainers' pre-push gate (scripts/mutants-remote-gate.sh)
    # already ran on that host. A fork's pull request stays on GitHub's image:
    # its code reaches the persistent host through no pre-push gate, and
    # `contents: read` and `persist-credentials: false` do not isolate a host
    # that outlives the job.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.PIXEL_RUNNER_LABELS && fromJSON(vars.PIXEL_RUNNER_LABELS) || 'ubuntu-26.04' }}
    timeout-minutes: 90
    # The Test job's value (ci.yml), at the same job level: rust-cache hashes
    # it into the `linux-debug` key, so a shard without it would restore
    # nothing. Every mutant's rebuild and link then skips full debug info.
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    strategy:
      # Every shard runs to the end even when another one has a survivor:
      # the author needs the whole list of MISSED lines from one push.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      # A shard's `target/` grows with every mutant it rebuilds. PR #222's
      # single job filled the runner's disk at its 101st mutant, and the 546
      # builds after that failed at the link step and came back `unviable`.
      # The preinstalled .NET, Android and GHC toolchains are never used here
      # and hold 16 GB, but deleting them costs 40 to 110 s per shard, often
      # more than the shard's mutants. ubuntu-26.04 starts with 92 GB free
      # and a shard used at most 9 GB (cache, baseline, 20 mutants; runs
      # 36182035966, 36195319520, 36200090079), so the toolchains go only
      # when an image leaves less than MIN_FREE_GB. This checks the root
      # filesystem only: /tmp can have a separate, smaller capacity (see
      # "Use disk-backed mutation temporary storage" below). A shard that
      # still fills either filesystem fails as `disk-full`, never passes.
      - name: Free the runner's disk
        env:
          MIN_FREE_GB: 50
        run: |
          df -h /
          free_gb=$(df --output=avail -BG / | tail -1 | tr -dc 0-9)
          if [ "$free_gb" -ge "$MIN_FREE_GB" ]; then
            echo "${free_gb} GB free, at least ${MIN_FREE_GB} GB: nothing to delete"
            exit 0
          fi
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          # The SHA pin no longer names the toolchain through the ref, so
          # it is passed explicitly (same channel as before).
          toolchain: stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # Same key as the CI test job: both build the Linux debug profile,
          # and only that job (on pushes to main) writes the entry. This
          # workflow runs on pull_request only, so `github.ref` is never a
          # branch and it can never save; read-only by construction.
          shared-key: linux-debug
          save-if: false

      - name: Install system dependencies
        # Vendored OpenSSL needs perl and make. The GitHub Ubuntu images ship
        # both ("already the newest version" in every log), so the ~7 s of
        # apt-get update runs only on an image that lacks one of them.
        run: |
          if command -v perl >/dev/null && command -v make >/dev/null; then
            echo "perl and make already installed"
          else
            sudo apt-get update
            sudo apt-get install -y perl make
          fi

      - name: Install cargo-mutants
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2
        with:
          tool: cargo-mutants@27.1.0

      - name: Download the diff and the listing
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: mutants-plan

      # Ubuntu 26.04 mounts /tmp as tmpfs. Run 37098135319 lost ten mutants
      # when cc could not create /tmp files, although / still had 88 GB free;
      # /tmp held 4.5-4.6 GB after the affected shards. GCC and Rust respect
      # TMPDIR, so put compiler and test scratch files on the runner's disk.
      # Not under RUNNER_TEMP: on the self-hosted runner it sits in a $HOME
      # that is itself a git repository, and every test that needs a scratch
      # directory outside git then sees that repository (#599's shards failed
      # their baseline on `non_git_plain_build` and six siblings). The same
      # job gets its own XDG_RUNTIME_DIR, which the runner service lacks: the
      # test process and the `pixel` binaries it spawns must resolve daemon
      # sockets into one place (scripts/mutants-gate-host.sh, which the gate
      # host runs with the same two settings).
      - name: Use disk-backed mutation temporary storage
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          # PIXEL_MUTANTS_SCRATCH_BASE is for scripts/test-mutants-config.py.
          base="${PIXEL_MUTANTS_SCRATCH_BASE:-/var/tmp}"
          scratch="$base/pixel-mutants-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-${SHARD//\//-of-}"
          mkdir -p "$scratch/tmp" "$scratch/runtime"
          chmod 700 "$scratch/runtime"
          {
            echo "PIXEL_MUTANTS_SCRATCH=$scratch"
            echo "TMPDIR=$scratch/tmp"
            echo "XDG_RUNTIME_DIR=$scratch/runtime"
          } >> "$GITHUB_ENV"

      # --in-place: mutate the checkout itself instead of copying it (CI
      # discards the tree). --no-shuffle: mutants run in source order, so
      # two runs of the same diff produce the same log and annotations, and
      # `--shard` cuts the same slices the plan job counted.
      # `--all-targets` (from .cargo/mutants.toml, as `--locked` is): the
      # per-mutant `cargo test` skips doctests (one
      # rustdoc pass per crate for a single doctest in the workspace); the
      # CI workflow still runs them unmutated. Exit codes: 0 all caught,
      # 2 missed, 3 timeout, 4 baseline tests already failing. Missed and
      # timeouts fail the job; GitHub annotations point at each surviving
      # mutant, and the job summary repeats the outcome list.
      # rust-cache exports CARGO_INCREMENTAL=0 for the job (smaller cache
      # entries). That is the wrong trade here: every mutant rebuilds the
      # mutated crate after a one-function change, which is exactly what
      # incremental compilation is for (pixel-cli: ~8 s -> ~3 s per mutant,
      # and the build is where a 60-mutant run spends most of its time).
      # Dependencies are never built incrementally, so the restored cache
      # stays valid.
      # What the shard starts from and what it ends with, in the log: the
      # first thing to read when mutants turn `unviable` in a block.
      - name: Disk before the mutants
        run: |
          df -h / /tmp "$TMPDIR"
          df -i / /tmp "$TMPDIR"
          sudo du -sh target ~/.cache/pixel "$RUNNER_TEMP" "$TMPDIR" /tmp 2>&1 || true

      # --config: the plan's copy of this workflow's configuration, the one
      # the listing was made with (see "List the mutants the diff produces").
      - name: Run this shard's mutants
        # The explicit shell adds pipefail: `tee` must not mask the exit code.
        shell: bash
        env:
          CARGO_INCREMENTAL: 1
          SHARD: ${{ matrix.shard }}
        run: >
          cargo mutants -vV --no-shuffle --in-place --config mutants-config.toml
          --in-diff pr.diff --shard "$SHARD" 2>&1 | tee results.txt

      - name: Disk after the mutants
        if: always()
        run: |
          df -h / /tmp "${TMPDIR:-$RUNNER_TEMP}"
          df -i / /tmp "${TMPDIR:-$RUNNER_TEMP}"
          sudo du -sh target ~/.cache/pixel "$RUNNER_TEMP" "${TMPDIR:-/tmp}" /tmp 2>&1 || true

      # /var/tmp outlives the job, unlike RUNNER_TEMP.
      - name: Remove the mutation scratch
        if: always()
        run: |
          if [ -n "${PIXEL_MUTANTS_SCRATCH:-}" ]; then
            rm -rf "$PIXEL_MUTANTS_SCRATCH"
          fi

      - name: Post job summary
        if: always()
        run: |
          {
            echo "### Mutants shard ${{ matrix.shard }}"
            echo '```'
            sed 's/\x1b\[[0-9;]*[mGKHF]//g' results.txt 2>/dev/null || echo "no output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Artifact names cannot hold the `/` of `k/n`, hence the job index.
      - name: Upload mutants.out
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mutants-out-${{ strategy.job-index }}
          path: mutants.out
          if-no-files-found: ignore
          # Re-running a failed shard replaces its previous attempt's
          # outcomes instead of failing on the name, or leaving the gate to
          # total a stale result.
          overwrite: true

  gate:
    # The check name the workflow reported before it was sharded, so links,
    # docs and habits that point at "Mutants in diff" still land on the
    # verdict.
    name: Mutants in diff
    needs: [scope, plan, shard]
    # Runs after failed or skipped shards too: it is the job that says what
    # they add up to. Not after a skipped plan: a release-prepare pull
    # request has no diff to gate.
    if: always() && needs.scope.outputs.release-prepare != 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Stop when the plan failed
        if: needs.plan.result != 'success'
        run: |
          echo "::error title=Mutation gate failed::the plan job did not list the diff's mutants (${{ needs.plan.result }})"
          exit 1

      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1
        with:
          persist-credentials: false

      - name: Download the diff and the listing
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: mutants-plan

      # One directory per shard under shards/, except for a lone shard,
      # whose files download-artifact extracts into shards/ itself (the
      # gate reads both). A shard that left no artifact leaves its mutants
      # without a verdict, and the next step counts them as such.
      - name: Download every shard's mutants.out
        if: needs.plan.outputs.mutants != '0' && needs.plan.outputs.duplicate != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: mutants-out-*
          path: shards

      # The shards were skipped because this exact tree already has a green
      # verdict from today (#590): say so instead of failing on unjudged
      # mutants -- the outcomes the report step would demand were judged by
      # the run the verdict points at.
      - name: Report the reused verdict
        if: needs.plan.outputs.duplicate == 'true'
        run: |
          {
            echo "### Mutants in diff: skipped"
            echo
            echo "This merge tree already has a green verdict from ${{ needs.plan.outputs.verdict-run }} (same UTC day); no shard re-ran."
          } >> "$GITHUB_STEP_SUMMARY"

      # A green job is not the same claim as "this diff was gated": a diff
      # whose every file is excluded produces no mutants, which reads as a
      # pass over untested code. This step states the tested count outright
      # and annotates the pull request when mutable Rust changed and nothing
      # came out of it. Pass --fail-on-vacuous to turn that annotation into
      # a red check; it is left off because a comment-only edit to a Rust
      # file legitimately produces no mutants and should not block a pull
      # request. --outcomes-root fails the job unless every listed mutant
      # was caught or unviable: a survivor in any shard, or a shard that
      # crashed or was cancelled before judging its slice.
      - name: Report what the gate actually tested
        if: needs.plan.outputs.duplicate != 'true'
        run: >
          python3 scripts/mutants-gate.py --diff pr.diff --list mutants-list.txt
          --outcomes-root shards --summary "$GITHUB_STEP_SUMMARY"

      # A green verdict records the mutated tree in the Actions cache under
      # mutants-verdict-<tree>-<day>: the plan job of a later run with an
      # identical tree finds it and skips the shards (#590). No always()
      # here on purpose: the steps above leave a failed gate before this
      # runs, so a run with a survivor or an unjudged mutant records
      # nothing, and a duplicate has nothing to record (the entry exists).
      - name: Record the green verdict
        if: needs.plan.outputs.duplicate != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/verdict"
          printf '%s\n' "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > "$RUNNER_TEMP/verdict/green"

      - name: Save the verdict under the tree-and-day key
        if: needs.plan.outputs.duplicate != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/verdict
          key: mutants-verdict-${{ needs.plan.outputs.tree }}-${{ needs.plan.outputs.day }}
