name: Setup Pixel action
on:
  pull_request:
    paths: ['.github/actions/setup-pixel/**', '.github/workflows/setup-pixel.yml', 'scripts/test-setup-pixel*.py', 'crates/pixel/**', 'crates/pixel-setup/**']
  push:
    branches: [main]
    paths: ['.github/actions/setup-pixel/**', '.github/workflows/setup-pixel.yml', 'scripts/test-setup-pixel*.py', 'crates/pixel/**', 'crates/pixel-setup/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Installer failure contracts
        run: python3 scripts/test-setup-pixel.py
      - name: Create a small consumer repository
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/consumer"
          git init "$RUNNER_TEMP/consumer"
          printf 'def greet():\n    return "hello"\n' > "$RUNNER_TEMP/consumer/hello.py"
      - uses: ./.github/actions/setup-pixel
        id: pixel
        with:
          version: v0.8.0
          path: ${{ runner.temp }}/consumer
          cache: 'true'
          cache-version: ${{ github.run_id }}-${{ github.run_attempt }}
          minimum-symbols: '1'
      - name: Verify installed binary and prepared graph
        shell: bash
        env:
          REPORT: ${{ steps.pixel.outputs.report }}
        run: |
          test "$(pixel -V)" = 'pixel 0.8.0'
          test "$PIXEL_DAEMON_AUTO_START" = 0
          python3 -c 'import json,os; r=json.load(open(os.environ["REPORT"])); assert r["daemon"] == "skipped"; assert r["graph"]["symbols"] == 1'
          test ! -e "$RUNNER_TEMP/consumer/.gitignore"
      - name: Change the consumer after the initial preparation
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/consumer/.pixel/"{base.shard,delta.shard,state.json,graph.v2.db,graph.v2.db-wal,graph.v2.db-shm}
          printf 'def second():\n    return 2\n' > "$RUNNER_TEMP/consumer/second.py"
      - uses: ./.github/actions/setup-pixel
        id: refreshed
        with:
          version: v0.8.0
          path: ${{ runner.temp }}/consumer
          cache: 'true'
          cache-version: ${{ github.run_id }}-${{ github.run_attempt }}
          minimum-symbols: '2'
          install-hooks: 'true'
      - name: Verify an existing index follows the checkout
        shell: bash
        env:
          REPORT: ${{ steps.refreshed.outputs.report }}
          CACHE_HIT: ${{ steps.refreshed.outputs.cache-hit }}
        run: |
          test "$CACHE_HIT" = true
          python3 -c 'import json,os; s=json.load(open(os.path.expanduser("~/.claude/settings.json"))); assert s["hooks"]["UserPromptSubmit"]'
          python3 -c 'import json,os; assert json.load(open(os.environ["REPORT"]))["graph"]["symbols"] == 2'
      - name: Install only, without a checkout or hooks
        uses: ./.github/actions/setup-pixel
        with:
          version: v0.8.0
          path: ${{ runner.temp }}
          prepare: 'false'
          cache: 'true'
      - name: Execute released hooks in an isolated home
        run: python3 scripts/test-setup-pixel-hooks.py --bin "$(command -v pixel)" --agent all
  source-hooks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: setup-pixel-hooks
      - name: Build the candidate CLI
        run: cargo build --locked -p pixel-cli --no-default-features --features model2vec
      - name: Execute selected hooks from the action installer
        run: |
          for agents in claude codex claude,codex; do
            python3 scripts/test-setup-pixel-hooks.py --bin target/debug/pixel --agent "$agents"
          done
