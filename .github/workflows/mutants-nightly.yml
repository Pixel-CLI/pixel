name: Mutants nightly

# The whole tree, one slice a night: the pull-request gate (mutants.yml)
# mutates only the lines a diff changes, so code merged before the gate, a
# pull request that only weakens tests, a newer cargo-mutants' operators and
# stale skips are never re-checked. scripts/mutants-nightly.py holds the
# rotation (seven slices of ten round-robin shards) and the report; the
# survivors land in one tracking issue, a section per night. The run blocks
# no pull request: it is red when its slice has a survivor, and the issue
# says which.
on:
  schedule:
    # 01:17 UTC, when no pull request competes for the 20 concurrent jobs.
    - cron: "17 1 * * *"
  workflow_dispatch:
    inputs:
      slice:
        description: "Slice to run, 0 (Monday's) to 6; empty runs today's"
        required: false
        type: string

# One night at a time; a dispatch while the scheduled run works waits.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    name: Nightly plan
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      slice: ${{ steps.plan.outputs.slice }}
      shards: ${{ steps.plan.outputs.shards }}
      expected: ${{ steps.plan.outputs.expected }}
    steps:
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      # The version mutants.yml pins: the listing and every shard must
      # generate the same list.
      - name: Install cargo-mutants
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2
        with:
          tool: cargo-mutants@27.1.0

      - name: List the whole tree's mutants
        run: cargo mutants --list > mutants-list.txt

      - name: Pick the slice
        id: plan
        env:
          SLICE: ${{ inputs.slice }}
        run: |
          weekday=${SLICE:-$(( $(date -u +%u) - 1 ))}
          python3 scripts/mutants-nightly.py plan --weekday "$weekday" \
            --list mutants-list.txt --github-output "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  shard:
    name: Nightly shard ${{ matrix.shard }}
    needs: plan
    runs-on: ubuntu-26.04
    # About 195 mutants a shard at ~16 s on average (25 s for pixel-cli,
    # 10 to 15 s for a library crate), plus the baseline.
    timeout-minutes: 240
    # The Test job's value (ci.yml), at job level: rust-cache hashes it into
    # the linux-debug key the shard restores.
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      # As in mutants.yml, with twice its floor: a nightly shard runs about
      # 195 mutants where a pull-request shard runs at most 66.
      - name: Free the runner's disk
        env:
          MIN_FREE_GB: 70
        run: |
          df -h /
          free_gb=$(df --output=avail -BG / | tail -1 | tr -dc 0-9)
          if [ "$free_gb" -ge "$MIN_FREE_GB" ]; then
            echo "${free_gb} GB free, at least ${MIN_FREE_GB} GB: nothing to delete"
            exit 0
          fi
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: linux-debug
          save-if: false

      - name: Install system dependencies
        # Vendored OpenSSL needs perl and make, which the image ships.
        run: |
          if command -v perl >/dev/null && command -v make >/dev/null; then
            echo "perl and make already installed"
          else
            sudo apt-get update
            sudo apt-get install -y perl make
          fi

      - name: Install cargo-mutants
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2
        with:
          tool: cargo-mutants@27.1.0

      # The pull-request shard's command without --in-diff, and with
      # round-robin sharding so each shard mixes crates. The cargo arguments
      # come from .cargo/mutants.toml, as for every lane
      # (scripts/test-mutants-config.py). CARGO_INCREMENTAL=1 for the reason
      # mutants.yml gives: every mutant rebuilds one crate after a
      # one-function change.
      - name: Run this shard's mutants
        shell: bash
        env:
          CARGO_INCREMENTAL: 1
          SHARD: ${{ matrix.shard }}
        run: >
          cargo mutants -vV --no-shuffle --in-place --shard "$SHARD"
          --sharding round-robin 2>&1 | tee results.txt

      - name: Disk after the mutants
        if: always()
        run: df -h / && sudo du -sh target 2>&1 || true

      # Artifact names cannot hold the `/` of `k/n`, hence the job index.
      - name: Upload mutants.out
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mutants-nightly-out-${{ strategy.job-index }}
          path: mutants.out
          if-no-files-found: ignore
          overwrite: true

  report:
    name: Nightly report
    needs: [plan, shard]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1
        with:
          persist-credentials: false

      - name: Download every shard's mutants.out
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: mutants-nightly-out-*
          path: shards

      # One issue, found by its label, holds a section per slice. The script
      # rewrites this slice's section and keeps the others; its exit code
      # (1 when the slice has a survivor or an unjudged mutant) is the job's,
      # after the issue is written. A reporter that fails before printing
      # (exit 2 on prose over the limit, or a crash) leaves the issue as it
      # was: an empty body must never replace the other slices and the notes.
      - name: Update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          SLICE: ${{ needs.plan.outputs.slice }}
          EXPECTED: ${{ needs.plan.outputs.expected }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create mutants-nightly --color B60205 \
            --description "Survivors of the nightly whole-tree mutation run" 2>/dev/null || true
          issue=$(gh issue list --label mutants-nightly --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$issue" ]; then
            gh issue view "$issue" --json body --jq .body > current.md
          else
            : > current.md
          fi
          status=0
          python3 scripts/mutants-nightly.py report --slice "$SLICE" --expected "$EXPECTED" \
            --outcomes-root shards --run-url "$RUN_URL" --sha "$GITHUB_SHA" \
            --issue-body current.md --summary "$GITHUB_STEP_SUMMARY" > new.md || status=$?
          if [ -s new.md ]; then
            if [ -n "$issue" ]; then
              gh issue edit "$issue" --body-file new.md
            else
              gh issue create --title "Mutants nightly: survivors" --label mutants-nightly --body-file new.md
            fi
          else
            echo "the reporter wrote no body; leaving the tracking issue untouched" >&2
          fi
          exit "$status"
