name: Plugins install

# The lane of issue #1131's part 2: the moved commands are installed from
# released plugin repositories, not built in this one, so nothing else proves
# that they still work with the pixel this checkout would ship. Every runner
# below builds the core (`dev-release`, the same `--locked` model2vec feature
# set cross-build.yml builds pull requests with) and then installs each of the
# five first-party releases through `scripts/ci/plugins-smoke.sh`, which
# asserts the install-hint → install → run path: the moved hint names the
# right repository, the install downloads `releases/latest/download/pixel-<n>
# -<triple>` and replaces the repository's launcher with it (`sha256
# verified`, the asset-over-launcher contract released cores below #1050
# lacked), the installed file's hash equals the published `.sha256`,
# and every manifest command routes through the core; the manifest's command
# list must also equal what `invoke.rs` moves for the repository, so release
# and core cannot drift apart. git and telemetry get real reads (a fixture
# repository, a fresh HOME); networked or interactive commands are validated
# by `--help`.
#
# The daily schedule is the point: plugin releases change on their own, and
# a lane that only ran on this repository's pull requests would let a
# published release break the promise silently. The runners are one per
# released triple, so the lane exercises every asset the five repositories
# publish: x86_64-musl, aarch64-musl, aarch64-darwin and x86_64-darwin (the
# intel runner is the only machine that can run that asset together with a
# core built here, since the core itself publishes no macOS Intel binary).
#
# Push and pull-request runs are scoped to the code the smoke crosses, not to
# every crate: the dispatch of an unknown word and the clap surface a new
# subcommand could shadow a moved word with (`pixel/src/main.rs`), the moved
# hint (`removed_commands.rs`), install / enable (`plugin_cmd.rs`, the whole
# `pixel-plugin` crate, `pixel-git` that its install runs git through) and
# the plugin skill it deploys (`pixel-setup/src/skill.rs`). Build breakage
# anywhere else is ci.yml's and cross-build.yml's to catch, and a dependency
# bump (`Cargo.lock`) that changes this path at run time is caught by the
# next daily run. `.cargo/` holds only `mutants.toml`.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/plugins-install.yml"
      - ".github/workflows/release-prepare-scope.yml"
      - "crates/pixel-git/**"
      - "crates/pixel-plugin/**"
      - "crates/pixel-setup/src/skill.rs"
      - "crates/pixel/src/main.rs"
      - "crates/pixel/src/plugin_cmd.rs"
      - "crates/pixel/src/removed_commands.rs"
      - "scripts/ci/plugins-smoke.sh"
  pull_request:
    paths:
      - ".github/workflows/plugins-install.yml"
      - ".github/workflows/release-prepare-scope.yml"
      - "crates/pixel-git/**"
      - "crates/pixel-plugin/**"
      - "crates/pixel-setup/src/skill.rs"
      - "crates/pixel/src/main.rs"
      - "crates/pixel/src/plugin_cmd.rs"
      - "crates/pixel/src/removed_commands.rs"
      - "scripts/ci/plugins-smoke.sh"
  schedule:
    - cron: "47 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Release-prepare pull request? Same skip cross-build.yml makes: the tag
  # waits for the push run of the merge commit, not for this lane.
  scope:
    uses: ./.github/workflows/release-prepare-scope.yml

  install:
    name: install ${{ matrix.os }}
    needs: scope
    if: needs.scope.outputs.release-prepare != 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      # One runner's failure must not hide the others'.
      fail-fast: false
      matrix:
        # One runner per released triple; the runner that cannot install the
        # released core is the one that still must install the *plugin* the
        # core would read on that machine (macos-15-intel, x86_64-darwin).
        include:
          - { os: ubuntu-26.04 }
          - { os: ubuntu-26.04-arm }
          - { os: macos-15 }
          - { os: macos-15-intel }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The lane never pushes.

          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      # Entries written by merges to main only, so a pull request can neither
      # thrash nor poison them; each runner's OS is its own key, matching the
      # binary it builds.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: plugins-install-${{ matrix.os }}
      - name: Build pixel (dev-release, model2vec only — the pull-request lane of cross-build.yml)
        run: cargo build --profile dev-release --locked --no-default-features --features model2vec -p pixel-cli
      - name: smoke pixel-git
        run: scripts/ci/plugins-smoke.sh target/dev-release/pixel pixel-git git
      - name: smoke pixel-recall
        run: scripts/ci/plugins-smoke.sh target/dev-release/pixel pixel-recall recall
      - name: smoke pixel-flow
        run: scripts/ci/plugins-smoke.sh target/dev-release/pixel pixel-flow flow
      - name: smoke pixel-utilities
        run: scripts/ci/plugins-smoke.sh target/dev-release/pixel pixel-utilities utilities
      - name: smoke pixel-telemetry
        run: scripts/ci/plugins-smoke.sh target/dev-release/pixel pixel-telemetry telemetry
