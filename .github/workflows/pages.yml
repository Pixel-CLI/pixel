name: Pages

# Builds website/ with Hugo and publishes it to GitHub Pages. The site reads
# docs/examples/ and the CLI's Cargo.toml through Hugo mounts, so a new
# recording or a version bump redeploys it too.
on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "docs/examples/**"
      # The JSON-LD's softwareVersion (website/hugo.toml mounts this manifest).
      - "crates/pixel/Cargo.toml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and a newer push never cancels one in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # A hosted runner: blacksmith self-hosted labels are not registered for
    # this repo (only a2 is), so they queue the deploy forever and the live
    # site goes stale (2026-10-04: #608's website merge sat un-published
    # >13h, still serving Gemini/Windsurf/LivioGama URLs).
    runs-on: ubuntu-26.04
    steps:
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1
        with:
          persist-credentials: false
          # The whole history: enableGitInfo dates each page by the last
          # commit that touched it, and a shallow clone would date them all
          # by HEAD.
          fetch-depth: 0
      # Installs the Hugo pin from website/mise.toml.
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          working_directory: website
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build with Hugo
        working-directory: website
        env:
          HUGO_ENVIRONMENT: production
        run: hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/public

  deploy:
    needs: build
    # A hosted runner: blacksmith self-hosted labels are not registered for
    # this repo (only a2 is), so they queue the deploy forever and the live
    # site goes stale (2026-10-04: #608's website merge sat un-published
    # >13h, still serving Gemini/Windsurf/LivioGama URLs).
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
