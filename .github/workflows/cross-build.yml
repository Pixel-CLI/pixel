name: Cross-build

# The release lanes, built exactly as release-build.yml builds them: musl through
# cross (--locked, model2vec only) and aarch64-apple-darwin natively. The Test job's `cargo check` of that feature
# set runs on glibc and cannot see a dependency that fails to link against
# musl or a Cargo.lock that --locked rejects, so this is the only job that
# proves a change still ships. It runs on every push to main and on the
# pull requests that can change the outcome; a docs, prompt or script PR
# skips it. The release workflow's build job builds the same lane again
# from the tag. No branch rule requires this check today; if one is added,
# the excluded paths need a twin workflow that reports success.
#
# A release-prepare pull request into main (`release-x.y.z` branch whose
# diff the `scope` job verifies, see ci.yml) skips the job: its diff is version bumps, Cargo.lock and the changelog, and the
# release skill tags only once the push run on the merge commit is green,
# so the pull request run would build the same tree twice. A maintenance
# release into `release/x.y` keeps it: no push run covers that branch.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - ".cargo/**"
      - ".github/workflows/cross-build.yml"
      - "Cargo.*"
      - "crates/**"
      - "deny.toml"
      - "rust-toolchain*"

# A new push to a pull request cancels the run still in flight for its
# previous commit. A push to main gets a group of its own commit, so a merge
# neither waits behind the previous merge's run nor cancels a pending one
# (see ci.yml).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# CI only reads the checkout; it never writes to the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Release-prepare pull request? See release-prepare-scope.yml.
  scope:
    uses: ./.github/workflows/release-prepare-scope.yml

  cross-build:
    name: Cross-build ${{ matrix.target }} (${{ matrix.profile }})
    needs: scope
    if: needs.scope.outputs.release-prepare != 'true'
    runs-on: ${{ matrix.os }}
    # A pull request into main builds `dev-release` (release without thin LTO
    # and with 16 codegen units): the lane still has to link against musl
    # with the release feature set and a --locked Cargo.lock, which is what
    # this job exists to prove, but the 16 workspace crates no longer go
    # through LTO. On PR runs every dependency already came from the cache
    # and those crates were the whole build: 2 min 21 s to 3 min 53 s in
    # `release` (runs 36576912510, 36579443968). The push to main keeps
    # building `release` exactly as release-build.yml does, and the release skill
    # tags only once that run is green, so an LTO-only failure still stops a
    # release before its tag. A maintenance pull request into `release/x.y`
    # keeps `release`: no push run covers that branch.
    #
    # The push to main runs both profiles, each as its own job with its own
    # cache key, so each saves the entry its readers restore: `release-<t>`
    # for the tag's build in release-build.yml, `dev-release-<t>` for the pull
    # requests. One key cannot hold both: an entry is immutable, and a push
    # whose key already exists saves nothing ("Cache up-to-date"), so a
    # dev-release build added to the release job would never reach the
    # entry pull requests restore, and they would compile every dependency
    # (280 to 328 crates, 3 min 21 s to 6 min 37 s on run 36599714619).
    strategy:
      fail-fast: true
      matrix:
        profile: ${{ fromJSON(github.event_name == 'push' && '["release", "dev-release"]' || (github.event_name == 'pull_request' && github.base_ref == 'main') && '["dev-release"]' || '["release"]') }}
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl, aarch64-apple-darwin]
        # The three release targets, on the runners release-build.yml builds them
        # on. aarch64-apple-darwin is here so a push to main proves the macOS
        # lane before a tag does, and saves the cache the tag's build restores.
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-26.04
          - target: aarch64-unknown-linux-musl
            os: ubuntu-26.04
          - target: aarch64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The job never pushes: do not leave the token in .git/config.
          persist-credentials: false

      # The skip-guard key (see ci.yml's changes job): the tree of the
      # commit this job checks out (the merge commit on a pull request),
      # scoped by profile and target -- the lanes build different feature
      # sets, so each judges its own verdict (#590).
      - name: Merge-commit tree and UTC day
        id: key
        run: |
          echo "tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"
          echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      # A green build of this tree, profile and target recorded a marker
      # under crossbuild-verdict-<profile>-<target>-<tree>-<day> (the save
      # steps below): a repush with no content change restores it and skips
      # the lane instead of re-running it. The UTC day in the key bounds the
      # reuse, the same way ci.yml's does.
      - name: Restore a green verdict for this exact tree and target
        id: verdict
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/verdict
          key: crossbuild-verdict-${{ matrix.profile }}-${{ matrix.target }}-${{ steps.key.outputs.tree }}-${{ steps.key.outputs.day }}

      - name: Skip when this tree already built green on this target
        id: dup
        if: steps.verdict.outputs.cache-hit == 'true'
        run: |
          if [ ! -f "$RUNNER_TEMP/verdict/green" ]; then
            echo "the restored cache holds no marker; building"
            exit 0
          fi
          echo "duplicate=true" >> "$GITHUB_OUTPUT"
          {
            echo "### Cross-build ${{ matrix.target }} (${{ matrix.profile }}) skipped"
            echo
            echo "This merge tree already built green in $(cat "$RUNNER_TEMP/verdict/green") (same UTC day)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install Rust toolchain
        if: steps.dup.outputs.duplicate != 'true'
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          # The SHA pin no longer names the toolchain through the ref, so
          # it is passed explicitly (same channel as before).
          toolchain: stable
          targets: ${{ matrix.target }}

      # One entry per target, shared with release-build.yml's build job: a shared
      # key replaces the job id in the cache key, so the tag's build (job
      # `build`) restores what this job (`cross-build`) saved on main. A tag
      # run can read the default branch's caches, never another tag's.
      - name: Cache Rust build
        if: steps.dup.outputs.duplicate != 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # PRs read the cache but never write it: only merges into main
          # refresh the shared entries, so one PR cannot thrash
          # or poison them. A failed build still saves what it compiled.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
          # `release-<target>` for the release profile, the name release-build.yml
          # restores; `dev-release-<target>` for the pull requests' profile.
          shared-key: ${{ matrix.profile }}-${{ matrix.target }}

      # Prebuilt binary instead of `cargo install cross` (~40 s per run).
      # cross compiles inside its own Docker image, which carries the musl
      # toolchain, so no host musl-tools/perl/make are needed.
      - name: Install cross
        if: runner.os == 'Linux' && steps.dup.outputs.duplicate != 'true'
        uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2
        with:
          tool: cross

      # Must match release-build.yml exactly, but for the profile (see the
      # job comment): fastembed (ONNX) has no musl build, but model2vec is pure
      # Rust and ships in the Linux release. Building without it here would
      # leave the released feature set untested.
      - name: Cross-build (model2vec only — ort-sys has no musl prebuilts)
        if: runner.os == 'Linux' && steps.dup.outputs.duplicate != 'true'
        run: cross build --profile ${{ matrix.profile }} --locked --no-default-features --features model2vec --target ${{ matrix.target }} -p pixel-cli

      # Must match release-build.yml's macOS step exactly, but for the profile:
      # default features, native.
      - name: Build (macOS native)
        if: runner.os == 'macOS' && steps.dup.outputs.duplicate != 'true'
        run: cargo build --profile ${{ matrix.profile }} --locked --target ${{ matrix.target }} -p pixel-cli

      # A green build records the verdict under
      # crossbuild-verdict-<profile>-<target>-<tree>-<day>: a later run of
      # the same tree, profile and target skips the lane (#590). success()
      # leaves a failed build nothing to record; a skipped duplicate has no
      # marker to write -- the entry it restored is the record.
      - name: Record the green verdict
        if: success() && steps.dup.outputs.duplicate != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/verdict"
          printf '%s\n' "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > "$RUNNER_TEMP/verdict/green"

      - name: Save the verdict under the tree-and-day key
        if: success() && steps.dup.outputs.duplicate != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/verdict
          key: crossbuild-verdict-${{ matrix.profile }}-${{ matrix.target }}-${{ steps.key.outputs.tree }}-${{ steps.key.outputs.day }}
