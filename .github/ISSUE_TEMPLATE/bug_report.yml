name: Bug report
description: Something Pixel does is wrong, crashes, or differs from the docs.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. A vulnerability goes through a private advisory instead,
        never a public issue: see [SECURITY.md](https://github.com/Pixel-CLI/pixel/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The command you ran, what it printed, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The smallest sequence that shows the problem, on a public repository if possible.
      placeholder: |
        1. pixel install
        2. ...
    validations:
      required: true
  - type: textarea
    id: version
    attributes:
      label: Output of `pixel --version`
      description: It names the release, the commit and the target the binary was built for.
      render: text
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform and install method
      placeholder: macOS 15 arm64, install.sh / Linux x86_64, Homebrew tap / built from source
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Coding agent, if one is involved
      placeholder: Claude Code 2.x, Codex, Pi, OpenCode, Antigravity, Cursor...
  - type: textarea
    id: doctor
    attributes:
      label: Output of `pixel doctor .` (optional)
      description: Run in the repository where the problem happens.
      render: text
