version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # One PR per week for all semver-compatible bumps (patch + minor).
      # Major bumps stay individual PRs: they can carry breaking changes
      # and deserve their own review.
      cargo-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # Action bumps are low-risk and reviewed together. Workflows pin
      # every action to a commit SHA with a `# vN` comment
      # (scripts/ci/verify-action-pins.py fails CI otherwise); Dependabot
      # moves the SHA and the comment together.
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "bun"
    directory: "/docs/motion"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
