version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # One PR per week for all semver-compatible bumps (patch + minor).
      # Major bumps stay individual PRs: they can carry breaking changes
      # and deserve their own review.
      cargo-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # fastembed 7.1.3 pins ort 2.0.0-rc.15, whose ort-sys leaves
      # onnxruntime::coreml symbols undefined in the aarch64-apple-darwin
      # release link (Cross-build, #1330). PR CI never runs that link, so
      # the bump looked green. Lift once a later fastembed links there.
      - dependency-name: "fastembed"
        versions: [">=7.1.2"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # Action bumps are low-risk and reviewed together. Workflows pin
      # every action to a commit SHA with a `# vN` comment
      # (scripts/ci/verify-action-pins.py fails CI otherwise); Dependabot
      # moves the SHA and the comment together.
      github-actions:
        patterns: ["*"]

  # The arena base pins its image as `node:22@sha256:<index digest>`;
  # Dependabot moves the digest when the tag is republished. The arm
  # Dockerfiles build FROM the local pixel-arena-base, which no registry
  # holds. The setup-smoke Dockerfile takes its base from run.sh as build
  # arguments, so its digests are bumped by hand there.
  - package-ecosystem: "docker"
    directory: "/eval/arena"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "pixel-arena-base"
      # The arms are compared on Node 22; a new major is a decision, not a bump.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
