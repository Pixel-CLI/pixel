[package]
name = "pixel-bench"
version = "0.8.0"
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[features]
default = ["pixel-recall/fastembed", "pixel-recall/model2vec"]
instruction-counts = ["dep:gungraun"]

[dependencies]
pixel-index = { path = "../pixel-index" }
gungraun = { version = "=0.20.0", optional = true }

[dev-dependencies]
criterion = { workspace = true }
pixel-daemon = { path = "../pixel-daemon" }
pixel-graph = { path = "../pixel-graph" }
pixel-proto = { path = "../pixel-proto" }
pixel-recall = { path = "../pixel-recall", default-features = false }
serde_json = { workspace = true }
tempfile = "3"
dhat = "0.3"
simd-json = "0.14"

[[bench]]
name = "gram_extraction"
harness = false

[[bench]]
name = "m1_latency"
harness = false

[[bench]]
name = "ndcg_relevance"
harness = false

[[bench]]
name = "tree_delta"
harness = false

[[bench]]
name = "wire"
harness = false

[[bench]]
name = "cosine"
harness = false

[[bench]]
name = "instructions"
harness = false
required-features = ["instruction-counts"]
