[package]
name = "pixel-graph"
version = "0.7.0"
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
pixel-git = { path = "../pixel-git" }
pixel-index = { path = "../pixel-index" }
tree-sitter = "0.27"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-c-sharp = "0.23"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-python = "0.25"
tree-sitter-ruby = "0.23"
# Generic-extractor expansion grammars (heuristic node-kind walker). Php, C,
# Swift, Elixir and Lua ship `LANGUAGE: LanguageFn` constants compatible with our
# tree-sitter 0.26 via `tree-sitter-language`. Kotlin's crate pins an older
# tree-sitter (`>= 0.21, < 0.23`) and is thus incompatible —— excluded.
tree-sitter-php = "0.24"
tree-sitter-c = "0.24"
tree-sitter-swift = "0.7"
tree-sitter-elixir = "0.3"
tree-sitter-lua = "0.5"
rayon = "1"
xxhash-rust = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"
mutants = { workspace = true }

[dev-dependencies]
tempfile = "3"
