[package]
name = "pixel-graph"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false
description = "The PIXEL code graph: one store, one pipeline, one parse per file"

[lints]
workspace = true

[dependencies]
pixel-model = { path = "../pixel-model" }
pixel-io = { path = "../pixel-io" }
rusqlite = { version = "0.40", features = ["bundled"] }
regex = "1"
rustc-hash = "1"
tree-sitter = "0.27"
tree-sitter-ruby = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-php = "0.25"
tree-sitter-c = "0.24"
tree-sitter-swift = "0.7"
tree-sitter-elixir = "0.3"
tree-sitter-lua = "0.5"
tree-sitter-kotlin-ng = "1.1"
mutants = { workspace = true }
# `O_NOFOLLOW` and `O_NONBLOCK` as the target defines them: their values
# differ between Linux architectures.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs"] }

[dev-dependencies]
proptest = { workspace = true }
tempfile = "3"
