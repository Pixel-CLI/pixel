[package]
name = "pixel-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "pixel"
path = "src/main.rs"

[features]
default = ["fastembed"]
fastembed = ["pixel-recall/fastembed"]

[dependencies]
pixel-index = { path = "../pixel-index" }
pixel-graph = { path = "../pixel-graph" }
pixel-recall = { path = "../pixel-recall" }
pixel-daemon = { path = "../pixel-daemon" }
pixel-rank = { path = "../pixel-rank" }
pixel-session = { path = "../pixel-session" }
clap = { version = "4.5", features = ["derive"] }
serde = "1"
serde_json = "1"
regex = "1.13"
