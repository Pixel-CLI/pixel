[package]
name = "pixel"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Pixel speeds up coding agents by pushing deterministic evidence when it can remove repeated investigation turns"
publish = false

[[bin]]
name = "pixel"
path = "src/main.rs"

[lints]
workspace = true

[features]
# Semantic search: `pixel search-meaning` and the brief's meaning leads embed
# with the cached Model2Vec code model (`specs/semantic.md`). Off by default:
# the backend pulls a tokenizer stack that the musl release build does not yet
# carry. Without it the command says so and the brief uses word leads.
semantic = ["pixel-daemon/semantic"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
pixel-brief = { path = "../pixel-brief" }
pixel-daemon = { path = "../pixel-daemon" }
pixel-graph = { path = "../pixel-graph" }
pixel-index = { path = "../pixel-index" }
pixel-io = { path = "../pixel-io" }
pixel-metrics = { path = "../pixel-metrics" }
pixel-model = { path = "../pixel-model" }
pixel-plugin = { path = "../pixel-plugin" }
pixel-proto = { path = "../pixel-proto" }
pixel-setup = { path = "../pixel-setup" }
mutants = { workspace = true }
serde = { workspace = true }
serde-saphyr = "2.0"
serde_json = { workspace = true }
tar = "0.4"
xxhash-rust = { workspace = true }
yaml-edit = { version = "0.3.2", default-features = false }
ureq = { version = "3", default-features = false, features = ["json", "rustls"] }

[dev-dependencies]
tempfile = { workspace = true }
toml_edit = "0.25.15"
serde_json = { workspace = true }
