# SPDX-License-Identifier: MIT

[package]
name = "pixel-cli"
version = "0.7.1"
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "pixel"
path = "src/main.rs"

[features]
default = ["fastembed", "model2vec"]
# ONNX-backed embeddings. Cannot build for *-unknown-linux-musl: ort-sys
# downloads a prebuilt ONNX Runtime and upstream publishes no musl build.
fastembed = ["pixel-recall/fastembed"]
# Pure-Rust embeddings. No ONNX, no OpenSSL, no C++ — builds fine for musl,
# so the Linux release keeps a working semantic channel without fastembed.
model2vec = ["pixel-recall/model2vec"]
# Dev tool excluded from the shipped binary (issue #602): `pixel
# ai-cli-readify` probes and rewrites agents' CLI configs.
readify = []

[dependencies]
mutants = { workspace = true }
pixel-index = { path = "../pixel-index" }
pixel-git = { path = "../pixel-git" }
pixel-recall = { path = "../pixel-recall", default-features = false }
pixel-daemon = { path = "../pixel-daemon" }
pixel-graph = { path = "../pixel-graph" }
pixel-rank = { path = "../pixel-rank" }
pixel-session = { path = "../pixel-session" }
pixel-ops = { path = "../pixel-ops" }
pixel-facts = { path = "../pixel-facts" }
pixel-install = { path = "../pixel-install" }
pixel-proto = { path = "../pixel-proto" }
pixel-actionlog = { path = "../pixel-actionlog" }
pixel-flow = { path = "../pixel-flow" }
pixel-ultraflow = { path = "../pixel-ultraflow" }
pixel-release = { path = "../pixel-release" }
pixel-task = { path = "../pixel-task" }
rusqlite = { version = "0.40", features = ["bundled"] }
fs2 = "0.4.3"
clap = { version = "4.5", features = ["derive"] }
serde = "1"
serde_json = "1"
serde-saphyr = "1.3"
yaml-edit = { version = "0.3.2", default-features = false }
regex = "1.13"
ignore = "0.4.33"
libc = "0.2"
ureq = { version = "3", default-features = false, features = ["json", "rustls"] }
tar = "0.4"
xxhash-rust = { workspace = true }
# Runtime now, not only a test dependency: the ai-cli-readify rewrite edits
# `~/.codex/config.toml` in place and has to preserve every key the user
# already has, so it parses and re-emits rather than replacing the file
# (src/ai_cli_readify/config.rs, approve.rs). Tests read the same crate to
# check `website/data/agents.toml` (tests/cli/docs_drift.rs).
toml_edit = "0.25.15"
