[package]
name = "mvp-index"
description = "pixel-mvp's indexer: tree-sitter grammars and one rule module per language (Ruby, Rust); returns rows, writes nothing. Maintained here; see ORIGIN.md."
version = "0.8.0"
edition.workspace = true
license.workspace = true
publish = false

# Retain the imported lint baseline; tightening it is a separate change.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"

[dependencies]
rustc-hash = "1"
tree-sitter = "0.27"
tree-sitter-ruby = "0.23"
tree-sitter-rust = "0.24"
mvp-model = { path = "../mvp-model" }
mutants = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
tempfile = "3"
