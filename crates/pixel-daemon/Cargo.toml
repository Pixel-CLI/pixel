[package]
name = "pixel-daemon"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false
description = "The PIXEL daemon: one Unix socket per repository, NDJSON ops, a single writer and read replicas"

[lints]
workspace = true

[features]
# Semantic search: the daemon can open the cached embedding model and keep a
# resident pool of code chunks (`specs/semantic.md`). Without it every
# `meaning` request answers `failed` and says the build has no semantic search.
semantic = ["pixel-index/model2vec"]

[dependencies]
fs2 = "0.4.3"
memchr = "2"
mutants = { workspace = true }
notify = "8"
regex = "1"
pixel-brief = { path = "../pixel-brief" }
pixel-graph = { path = "../pixel-graph" }
pixel-index = { path = "../pixel-index" }
pixel-io = { path = "../pixel-io" }
pixel-metrics = { path = "../pixel-metrics" }
pixel-model = { path = "../pixel-model" }
pixel-plugin = { path = "../pixel-plugin" }
pixel-proto = { path = "../pixel-proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xxhash-rust = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
