[package]
name = "pixel-daemon"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
pixel-index = { path = "../pixel-index" }
pixel-graph = { path = "../pixel-graph" }
pixel-context = { path = "../pixel-context" }
pixel-rank = { path = "../pixel-rank" }
pixel-proto = { path = "../pixel-proto" }
pixel-recall = { path = "../pixel-recall", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "7"
rusqlite = { version = "0.32", features = ["bundled"] }
xxhash-rust = { workspace = true }
