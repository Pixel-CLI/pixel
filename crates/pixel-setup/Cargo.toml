[package]
name = "pixel-setup"
version = "0.12.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
pixel-proto = { path = "../pixel-proto" }
pixel-daemon = { path = "../pixel-daemon" }
pixel-index = { path = "../pixel-index" }
pixel-facts = { path = "../pixel-facts" }
pixel-git = { path = "../pixel-git" }
pixel-plugin = { path = "../pixel-plugin" }
serde = { version = "1", features = ["derive"] }
serde-saphyr = "2.0"
# `config_file`: comment-preserving writes of `config.yaml`.
yaml-edit = { version = "0.3.2", default-features = false }
serde_json = "1"
sha2 = { workspace = true }
thiserror = "2"
toml_edit = "0.25.15"

[dev-dependencies]
mutants = { workspace = true }
tempfile = "3"
