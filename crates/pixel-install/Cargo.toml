[package]
name = "pixel-install"
version = "0.7.0"
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
mutants = { workspace = true }
pixel-proto = { path = "../pixel-proto" }
pixel-daemon = { path = "../pixel-daemon" }
pixel-index = { path = "../pixel-index" }
pixel-facts = { path = "../pixel-facts" }
pixel-git = { path = "../pixel-git" }
serde = { version = "1", features = ["derive"] }
serde-saphyr = "1.3"
serde_json = "1"
sha2 = { workspace = true }
thiserror = "2"
toml_edit = "0.25.15"

[dev-dependencies]
tempfile = "3"
