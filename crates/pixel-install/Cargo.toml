[package]
name = "pixel-install"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
pixel-proto = { path = "../pixel-proto" }
pixel-daemon = { path = "../pixel-daemon" }
pixel-index = { path = "../pixel-index" }
pixel-facts = { path = "../pixel-facts" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
