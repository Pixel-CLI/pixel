# Vendored from pixel-mvp (VENDORED.md): `src/` is a copy, this manifest is
# the workspace's.

[package]
name = "mvp-store"
description = "pixel-mvp's graph store: graph.db, its schema and generations. Vendored, see VENDORED.md."
version = "0.7.1"
edition.workspace = true
license.workspace = true
publish = false

# pixel-mvp's lint table, not the workspace's: the vendored source is kept
# as pixel-mvp checks it, so a sync stays a copy (VENDORED.md).
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"

[dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
mvp-model = { path = "../mvp-model" }

# `O_NOFOLLOW` and `O_NONBLOCK` as the target defines them (C-18): their
# values differ between Linux architectures, and the crate forbids
# `unsafe`, so no libc call.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs"] }

[dev-dependencies]
tempfile = "3"
