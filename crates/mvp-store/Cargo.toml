[package]
name = "mvp-store"
description = "pixel-mvp's graph store: graph.db, its schema and generations. Maintained here; see ORIGIN.md."
version = "0.8.0"
edition.workspace = true
license.workspace = true
publish = false

# Retain the imported lint baseline; tightening it is a separate change.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"

[dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
mvp-model = { path = "../mvp-model" }

# `O_NOFOLLOW` and `O_NONBLOCK` as the target defines them (C-18): their
# values differ between Linux architectures, and the crate forbids
# `unsafe`, so no libc call.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs"] }

[dev-dependencies]
tempfile = "3"
