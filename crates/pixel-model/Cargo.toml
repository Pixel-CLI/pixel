# Pure model of the index: values only, no I/O (clippy.toml enforces it).

[package]
name = "pixel-model"
description = "Pure model of the PIXEL index: rows, terms, hashing and the Graph read trait. Depends on nothing."
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

# Retain the imported lint baseline; tightening it is a separate change.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"

[dependencies]
