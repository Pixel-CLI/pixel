name = "cand-k-member-manifest"
version = "0.1.0"
api = 1
description = "A question about one named workspace member ('what does the X crate contain / depend on'): its manifest (features, optional and dev dependencies) and every tracked file of its directory"
run = "probe"
capabilities = ["brief-probe"]

[brief-probe]
owner = "pixel"
skip_kinds = ["history", "impact", "flow"]
when_prompt = "(?i)\\b(crates?|packages?|modules?|libraries|library|libs?)\\b.*\\b(contains?|depend\\w*|dependenc\\w+|features?|made of|exports?|provides?|includes?)\\b|\\b(contains?|depend\\w*|features?)\\b.*\\b(crates?|packages?|modules?|libs?)\\b"
when_gate_closed = true
budget_ms = 1500
mode = "append"
