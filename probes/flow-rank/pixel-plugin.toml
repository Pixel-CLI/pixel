name = "flow-rank"
version = "0.2.0"
api = 1
description = "Ranks the callees of a walkthrough's entry (the one the question names, else the brief's) by the question's words and shows their bodies"
run = "probe"
capabilities = ["brief-probe"]

[brief-probe]
owner = "pixel"
when_kinds = ["flow"]
# A walkthrough the brief did not classify as flow (a "rationale" or unjudged prompt) still gets its chain.
when_prompt = "(?i)(\\bwalk (me )?through\\b.*\\b(hook|prompt|router|request|press|key|event|response|code|function|method)\\b|\\b(hook|prompt|router|request|press|key|event|response|code|function|method)\\b.*\\bwalk (me )?through\\b|\\b(trace|walk|flow|happens|path)\\b.{0,220}\\b(hook|prompt)\\b|\\b(trace|walk|flow|happens|path)\\b.{0,120}\\b(undo|redo)\\b.{0,100}\\b(keyboard shortcut|shortcut)\\b|\\b(how does|walk|trace|flow|happens|path)\\b.{0,160}\\b(application|app)\\b.{0,50}\\bcallback\\b.{0,180}\\brequest\\b.{0,160}\\b(router|routing|route)\\b.{0,160}\\b(completion|response)\\b.{0,50}\\bcallback\\b)"
when_gate_closed = true
budget_ms = 1500
mode = "lead"
