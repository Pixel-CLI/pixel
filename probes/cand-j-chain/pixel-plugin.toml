name = "cand-j-chain"
version = "0.1.0"
api = 1
description = "For a 'trace how A becomes a T from main through ...' question: the call chain from the entry the question names to the constructors of the type it names, each hop at its call site, plus the callees that carry the question's words"
run = "probe"
capabilities = ["brief-probe"]

[brief-probe]
owner = "LivioGama"
when_prompt = "(?i)\\b(trace|call (chain|path)|end to end|walk (me )?through|from \\w+ (through|to|into))\\b"
skip_kinds = ["overview", "review", "history"]
when_gate_closed = true
budget_ms = 2500
mode = "lead"
