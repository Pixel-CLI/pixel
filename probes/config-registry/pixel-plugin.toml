name = "config-registry"
version = "0.1.0"
api = 1
description = "A registry of the configuration keys a setting question asks about"
run = "probe"
capabilities = ["brief-probe"]

[brief-probe]
owner = "pixel"
when_kinds = ["config"]
when_prompt = "(?i)\\b(config\\w*|settings?|env(ironment)?|variables?|flags?|options?|defaults?|ports?|overrid\\w+|max(?:imum)?|min(?:imum)?|bounds?)\\b"
budget_ms = 2000
mode = "lead"
