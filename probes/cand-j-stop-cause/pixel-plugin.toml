name = "cand-j-stop-cause"
version = "0.1.0"
api = 1
description = "Answers a 'why does X stop/skip/ignore ...' question with the code that implements the behaviour and the tests that prove it, found by the question's rare words, and drops brief blocks that carry only one of them"
run = "probe"
capabilities = ["brief-probe"]

[brief-probe]
owner = "LivioGama"
when_prompt = "(?i)\\bwhy\\b.*\\b(stops?|stopp\\w+|skips?|skipp\\w+|ignor\\w+|hid\\w+|hides?|suppress\\w+|refus\\w+|never|silently|missing|drops?|dropp\\w+|fails?|not)\\b"
skip_kinds = ["overview", "review", "history"]
when_gate_closed = true
budget_ms = 2500
mode = "lead"
