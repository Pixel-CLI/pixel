# Copy this directory to probes/<your-name>/ and change `name` (it must equal the directory name).
name = "template"
version = "0.1.0"
api = 1
description = "One sentence: what evidence this probe adds to the brief, and for which questions"
run = "probe"
capabilities = ["brief-probe"]

[brief-probe]
owner = "your-github-handle"
# Run for these question kinds, or when the prompt matches the regex; with neither the probe always runs.
# when_kinds = ["history"]
# when_prompt = "(?i)\\b(config|setting)\\b"
# Never run for these kinds (the kind is null for a weak, low-tier brief, so skip rather than require).
# skip_kinds = ["overview", "review"]
budget_ms = 500
# "lead": your blocks go before the brief's; "append": after.
mode = "append"
