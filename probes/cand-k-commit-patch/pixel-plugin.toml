name = "cand-k-commit-patch"
version = "0.1.0"
api = 1
description = "A commit question: the full changed-file stat and the per-file hunks (source first, lockfiles summarised) within a budget, under the same header as history-fallback so it replaces that block"
run = "probe"
capabilities = ["brief-probe"]

[brief-probe]
owner = "pixel"
when_kinds = ["history"]
skip_kinds = ["review"]
when_prompt = "(?i)\\b(commits?|changelog|git history|introduced|blame|released?|tagged?)\\b"
when_gate_closed = true
budget_ms = 2000
mode = "lead"
