name = "test-bodies"
version = "0.1.0"
api = 1
description = "For a question about tests: the bodies of the test cases whose name or body carries the question's subject, from the test files the brief names and those whose path names the subject, best first"
run = "probe"
capabilities = ["brief-probe"]

[brief-probe]
owner = "pixel"
when_kinds = ["tests"]
when_prompt = "(?i)\\b(tests?|specs?)\\b"
skip_kinds = ["history", "review"]
budget_ms = 1500
mode = "append"
