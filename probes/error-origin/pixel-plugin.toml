name = "error-origin"
version = "0.2.0"
api = 1
description = "Shows where an error message the question quotes or describes is raised, who calls it and the condition that selects the path"
run = "probe"
capabilities = ["brief-probe"]

[brief-probe]
owner = "pixel"
# A quoted message, or one the question describes in words ("the error about working outside of application context").
when_prompt = "['\"`‘“][^'\"`’”]{12,}['\"`’”]|(?i:\\b(errors?|exceptions?|messages?|warnings?|alerts?|panics?|text)\\b)"
budget_ms = 2000
mode = "append"
