name = "overview-answer-evidence"
version = "0.1.0"
api = 1
description = "Answers what a named Cargo member exposes, depends on, and includes"
run = "probe"
capabilities = ["brief-probe"]

[brief-probe]
owner = "pixel"
when_prompt = "(?i)\\b(?:crate|library)\\b"
skip_kinds = ["history", "impact", "review"]
when_gate_closed = true
budget_ms = 2500
mode = "lead"
