# Every public number Pixel quotes, bound to the binary that produced it.
#
# One [[claim]] per figure a reader sees (README, the website, docs/bench):
#
#   id              stable name; scripts/bench/refresh-claim.sh <id> re-runs it
#   doc             the file that quotes the number
#   anchor          literal text of `doc` holding the number, so the entry
#                   cannot outlive the sentence it describes
#   version_text    literal text of `doc` that states the binary version
#   protocol        where the method and raw output live
#   binary_version  the pixel version measured: "x.y.z", "x.y.x" for a
#                   range of patches, or "unknown" when nobody recorded it
#   commit          the pixel commit measured ("" when unknown)
#   measured        the date of the run
#   command         the exact command that re-measures it
#   live            true when it needs an agent, a model or another paid or
#                   installed tool: refresh-claim.sh then refuses to run it
#                   without --live
#   tracking        the issue that re-measures a claim known to be stale
#
# scripts/ci/check-claims.py (CI: the docs job) fails when a claim's version
# is more than one minor behind crates/pixel/Cargo.toml without a
# `tracking` issue, when its doc no longer holds `anchor` or
# `version_text`, or when an entry is malformed. A tracked stale claim is
# printed as a warning on every run.

