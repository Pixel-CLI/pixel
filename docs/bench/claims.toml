protocol = "docs/motion/prompt-submit/README.md"
binary_version = "0.5.x"
commit = ""
measured = "2026-09"
command = "a recorded Codex session on psf/requests, with and without the prompt-submit brief (docs/motion/prompt-submit/README.md)"
live = true
tracking = "#1093"

