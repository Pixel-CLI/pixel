# osv-scanner configuration, read from next to Cargo.lock. OpenSSF Scorecard's
# Vulnerabilities check scans the lockfile with osv-scanner and honours this
# file; it never reads deny.toml. Each entry repeats an `[advisories] ignore`
# entry of deny.toml with its reason, where the full justification lives;
# scripts/ci/check-advisory-ignores.py (the `deny` CI job) fails when the two
# lists differ. The first two are informational "unmaintained" notices; the
# third is a vulnerability whose fixed roots the locked crate already ships.

[[IgnoredVulns]]
id = "RUSTSEC-2024-0436"
reason = "paste is unmaintained: transitive via tokenizers 0.21 <- model2vec-rs and 0.23 <- fastembed; proc-macro, no runtime surface"

[[IgnoredVulns]]
id = "RUSTSEC-2025-0119"
reason = "number_prefix is unmaintained: transitive via indicatif 0.17 <- hf-hub 0.4 and tokenizers 0.21 <- model2vec-rs; formatting helper, unused by pixel"

[[IgnoredVulns]]
id = "RUSTSEC-2026-0381"
reason = "webpki-roots 0.26.11 only re-exports webpki-roots 1.x TLS_SERVER_ROOTS and Cargo.lock pins 1.0.10 (patched); via ureq 2 <- hf-hub 0.4 <- model2vec-rs"
