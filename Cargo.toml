[workspace]
resolver = "3"
members = ["crates/pixel", "crates/pixel-brief", "crates/pixel-io", "crates/pixel-model", "crates/pixel-proto", "crates/pixel-metrics", "crates/pixel-graph", "crates/pixel-index", "crates/pixel-daemon", "crates/pixel-setup", "crates/pixel-plugin"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/Pixel-CLI/pixel"
# The container and CI both run stable; raise this only when a crate needs it.
rust-version = "1.97"

# Lint policy for every workspace member (each crate opts in with
# `[lints] workspace = true`). CI runs clippy with `-D warnings`, so every
# `warn` below is a hard gate there; this table exists so a local
# `cargo clippy` agrees with CI and so the decisions are made once, here.
#
# Lints are named one by one rather than through `pedantic`/`nursery` groups:
# CI floats on stable, and a group would turn a toolchain release into a red
# CI whenever it adds a lint. Group entries carry `priority = -1` so a named
# lint can override its group.
[workspace.lints.rust]
# Every `unsafe` block is a claim about invariants; the claim goes next to it.
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
# --- Safety ------------------------------------------------------------
undocumented_unsafe_blocks = "warn" # `// SAFETY:` comment on every unsafe block
ptr_as_ptr = "warn"                 # `.cast()` keeps pointer casts checked
# --- Leftovers that never ship ----------------------------------------------
dbg_macro = "warn"
todo = "warn"
# --- Pedantic lints adopted (each was clean or fixed when enabled) --------
checked_conversions = "warn"                # `T::try_from(x).is_ok()` over manual range checks
large_stack_arrays = "warn"                 # a 16 KiB array on the stack is a heap buffer
manual_assert = "warn"                      # `assert!(cond, ..)` over `if !cond { panic!(..) }`
manual_assert_eq = "warn"
match_wildcard_for_single_variants = "warn" # a wildcard that hides one variant hides future ones
stable_sort_primitive = "warn"              # `sort_unstable` for primitives: same result, faster
unreadable_literal = "warn"                 # `1_000_000`, not `1000000`
doc_link_with_quotes = "warn"
items_after_statements = "warn"             # items exist for the whole scope: declare them first
map_unwrap_or = "warn"                      # `map_or`/`map_or_else`/`is_some_and` over `map().unwrap_or()`
redundant_closure_for_method_calls = "warn" # `map(str::trim)`, not `map(|s| s.trim())`
uninlined_format_args = "warn"              # `format!("{name}")`, not `format!("{}", name)`

[workspace.dependencies]
# Attribute crate for `#[cfg_attr(test, mutants::skip)]` (cargo-mutants).
mutants = "0.0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
proptest = "1.6"
crc32fast = "1.4"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
tempfile = "3"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"

# Local iteration profile: the release optimisation level without fat LTO and
# a single codegen unit, so an incremental rebuild takes seconds.
[profile.dev-release]
inherits = "release"
lto = false
codegen-units = 16
debug = "line-tables-only"
strip = "none"

# cross reads this instead of a root Cross.toml (workspace.metadata.cross is
# its documented manifest location). It forwards RUSTFLAGS and the CARGO_*
# variables into its container by itself, not SOURCE_DATE_EPOCH:
# crates/pixel/build.rs reads it for the build date `pixel --version` prints,
# which scripts/release/release-build-env.sh pins to the commit's time so a
# release build is reproducible.
[workspace.metadata.cross.build.env]
passthrough = ["SOURCE_DATE_EPOCH"]
