[workspace]
resolver = "3"
members = ["crates/pixel-index", "crates/pixel", "crates/pixel-graph", "crates/pixel-context", "crates/pixel-daemon", "crates/pixel-recall", "crates/pixel-bench", "crates/pixel-session", "crates/pixel-proto", "crates/pixel-git"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/LivioGama/pixel"

[workspace.dependencies]
crc32fast = "1.4"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
proptest = "1.6"
criterion = "0.5"

[profile.release]
lto = "thin"
codegen-units = 1
