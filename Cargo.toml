[workspace]
resolver = "3"
members = ["crates/pixel-index", "crates/pixel", "crates/pixel-graph", "crates/pixel-context", "crates/pixel-daemon", "crates/pixel-recall", "crates/pixel-bench", "crates/pixel-session", "crates/pixel-proto", "crates/pixel-git", "crates/pixel-rank", "crates/pixel-ops", "crates/pixel-facts", "crates/pixel-install", "crates/pixel-actionlog", "crates/pixel-flow"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/LivioGama/pixel"

[workspace.dependencies]
crc32fast = "1.4"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
proptest = "1.6"
criterion = "0.5"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[profile.release]
lto = "thin"
codegen-units = 1
